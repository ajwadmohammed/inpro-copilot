# Every push to main: run all tests; only if they pass, publish the new version to the Hugging Face Space.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Tesseract (reads scanned invoices)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Run the tests
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=0.30"
      - name: Publish to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: python deploy/hf_deploy.py --wait
