# Optional: publish to a Hugging Face Space instead of Render (Docker Spaces need a Hugging Face PRO plan).
# Runs only when started by hand (Actions > Deploy to Hugging Face > Run workflow).
name: Deploy to Hugging Face

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=0.30"
      - name: Publish to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: python deploy/hf_deploy.py --wait
