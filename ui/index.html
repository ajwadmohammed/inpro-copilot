<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InPro Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================ tokens */
  :root {
    --canvas: #f2f3f5;  --surface: #ffffff;  --surface-2: #f7f8fa;  --surface-3: #eef0f3;
    --ink: #1a1f27;     --ink-2: #4a5260;    --ink-3: #6e7683;
    --line: #e3e6ea;    --line-2: #cdd2d9;
    --primary: #1f2a37; --primary-hover: #2c3a4a; --on-primary: #ffffff;
    --ok: #1d7a4e;   --ok-bg: #e7f4ed;   --ok-line: #b9dfca;
    --warn: #935700; --warn-bg: #fbf1de; --warn-line: #ecd3a3;
    --bad: #b42318;  --bad-bg: #fdeceb;  --bad-line: #f3c2bd;
    --skip: #6e7683; --skip-bg: #eef0f3;
    --focus: #3d6fb6;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06);
    --font: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #0f1216;  --surface: #161a20;  --surface-2: #1b2027;  --surface-3: #222831;
      --ink: #e7eaee;     --ink-2: #a9b1bc;    --ink-3: #7e8794;
      --line: #262c35;    --line-2: #353c47;
      --primary: #e7eaee; --primary-hover: #ffffff; --on-primary: #11151a;
      --ok: #4cc38a;   --ok-bg: #11281d;   --ok-line: #1f4a35;
      --warn: #e5a443; --warn-bg: #2b2111; --warn-line: #4f3b17;
      --bad: #f2766b;  --bad-bg: #321614;  --bad-line: #5a2622;
      --skip: #7e8794; --skip-bg: #222831;
      --focus: #7aa7e6;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }

  /* ============================================================ base */
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 14.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .muted { color: var(--ink-3); }
  .sub { color: var(--ink-3); font-size: 13px; }
  h1 { font-size: 22px; line-height: 1.25; margin: 0; letter-spacing: -0.01em; font-weight: 600; }
  h2 { font-size: 14.5px; font-weight: 600; margin: 28px 0 10px; }
  p { margin: 0; }
  svg { flex: none; }

  /* ============================================================ buttons: one system everywhere */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px;
         border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
         font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap;
         transition: background .12s, border-color .12s; }
  .btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-approve { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn-approve:hover { background: color-mix(in srgb, var(--ok) 88%, #000); border-color: transparent; }
  .btn-reject { color: var(--bad); border-color: var(--bad-line); }
  .btn-reject:hover { background: var(--bad-bg); border-color: var(--bad); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); padding: 0 10px; }
  .btn-ghost:hover { background: var(--surface-3); border-color: transparent; color: var(--ink); }
  .btn-danger { color: var(--bad); }
  .btn-sm { height: 30px; padding: 0 10px; font-size: 13px; }
  .btn-block { width: 100%; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  @media (prefers-color-scheme: dark) { .btn-approve { color: #0b1a12; } }

  /* ============================================================ form controls */
  .field { display: grid; gap: 6px; }
  .field label { font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .input, select.input, textarea.input { height: 38px; width: 100%; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--radius);
         background: var(--surface); transition: border-color .12s, box-shadow .12s; }
  textarea.input { height: auto; min-height: 40px; padding: 9px 12px; resize: vertical; }
  .input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
  .input::placeholder { color: var(--ink-3); }
  .form-error { color: var(--bad); font-size: 13.5px; }

  /* ============================================================ sign-in */
  .login { min-height: 100%; display: grid; place-items: center; padding: 40px 16px; }
  .login-box { width: 100%; max-width: 400px; }
  .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; font-weight: 600; font-size: 16px; }
  .login-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px; box-shadow: var(--shadow); }
  .login-card h1 { font-size: 20px; margin-bottom: 4px; }
  .login-card form { display: grid; gap: 16px; margin-top: 22px; }
  .demo { margin-top: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .demo-head { padding: 14px 18px 10px; font-size: 13px; color: var(--ink-2); }
  .demo-head b { color: var(--ink); font-weight: 600; }
  .demo-row { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-top: 1px solid var(--line); }
  .demo-row div { flex: 1; min-width: 0; }
  .demo-row b { font-weight: 600; font-size: 14px; }
  .login-foot { margin-top: 18px; font-size: 12.5px; color: var(--ink-3); text-align: center; }
  .login.split { grid-template-columns: minmax(0, 540px) minmax(0, 400px); gap: 72px; justify-content: center; align-content: center; }
  .pitch h1 { font-size: 36px; line-height: 1.12; letter-spacing: -0.028em; font-weight: 600; margin: 34px 0 14px; max-width: 20ch; }
  .pitch > p { color: var(--ink-2); font-size: 15.5px; line-height: 1.55; max-width: 48ch; }
  .evidence { margin-top: 30px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); }
  .ev-head { padding: 11px 16px; font-size: 12.5px; color: var(--ink-3); border-bottom: 1px solid var(--line); }
  .ev-row { display: grid; grid-template-columns: 104px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .ev-row:last-child { border-bottom: 0; }
  .ev-label { font-size: 13px; font-weight: 600; }
  .ev-vals { display: grid; gap: 4px; min-width: 0; }
  .ev-vals > span { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .ev-vals svg { width: 12px; height: 12px; flex: none; }
  .ev-ok svg { color: var(--ok); } .ev-bad svg { color: var(--bad); }
  .ev-vals code { font: 500 12.5px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev-ok code { color: var(--ink-3); }
  .ev-vals mark { background: var(--bad-bg); color: var(--bad); border-radius: 2px; padding: 0 1px; }
  .pitch > p.credit { margin-top: 18px; font-size: 12.5px; color: var(--ink-3); max-width: 60ch; }
  .demo.first { margin-top: 0; }
  .login-card.secondary { margin-top: 16px; padding: 22px 24px; box-shadow: none; }
  .login-card.secondary h1 { font-size: 15px; font-weight: 600; }
  .login-card.secondary form { margin-top: 16px; gap: 12px; }

  /* ============================================================ app shell */
  .shell { display: grid; grid-template-columns: 236px 1fr; height: 100%; }
  .side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; font-weight: 600; font-size: 15.5px; text-decoration: none; }
  .brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
  .brand small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-3); margin-top: -2px; }
  nav.menu { padding: 6px 10px; display: grid; gap: 2px; }
  .menu a { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 7px; text-decoration: none; color: var(--ink-2); font-weight: 500; }
  .menu a:hover { background: var(--surface-3); color: var(--ink); }
  .menu a[aria-current="page"] { background: var(--surface-3); color: var(--ink); box-shadow: inset 2px 0 0 var(--primary); }
  .menu .count { margin-left: auto; font-size: 12px; font-weight: 600; background: var(--warn-bg); color: var(--warn); border-radius: 99px; padding: 0 8px; line-height: 20px; }
  .menu-label { font-size: 12px; color: var(--ink-3); padding: 14px 20px 4px; }
  .side-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 14px; display: grid; gap: 10px; }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-weight: 600; font-size: 12.5px; color: var(--ink-2); flex: none; }
  .who div b { display: block; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who div span { display: block; font-size: 12px; color: var(--ink-3); }
  .side-actions { display: flex; gap: 4px; }
  .reader { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); padding: 0 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

  main { min-width: 0; min-height: 0; overflow-y: auto; }
  .page { max-width: 1160px; margin: 0 auto; padding: 28px 32px 64px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .page-head p { color: var(--ink-2); margin-top: 4px; max-width: 64ch; }
  .page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ============================================================ panels and tables */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .page > .panel + .panel { margin-top: 16px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { margin: 0; }
  .panel-body { padding: 18px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--ink-3); padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
  th:first-child { border-top-left-radius: 10px; } th:last-child { border-top-right-radius: 10px; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--surface-2); }
  td.r, th.r { text-align: right; }
  td.num, td.r { white-space: nowrap; }
  td .verdict { white-space: nowrap; }
  .cell-title { font-weight: 600; color: var(--ink); text-decoration: none; }
  .empty { padding: 48px 24px; text-align: center; color: var(--ink-2); }
  .empty p { margin-bottom: 16px; }

  /* status, verdicts */
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; height: 24px; padding: 0 10px; border-radius: 99px; white-space: nowrap; border: 1px solid transparent; }
  .p-pending  { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
  .p-approved { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-line); }
  .p-rejected { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-line); }
  .p-neutral  { background: var(--surface-3); color: var(--ink-2); }
  .verdict { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13.5px; }
  .v-ok { color: var(--ok); } .v-warn { color: var(--warn); } .v-bad { color: var(--bad); }

  /* the queue summary */
  .summary { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding: 16px 18px; }
  .bar { flex: 1 1 260px; display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-3); }
  .bar i { display: block; height: 100%; }
  .legend { display: flex; gap: 6px 20px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); }
  .legend b { color: var(--ink); font-weight: 600; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; background: var(--surface-3); border-radius: 9px; padding: 3px; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .seg button { border: 0; background: transparent; height: 30px; padding: 0 12px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: 13.5px; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .seg small { margin-left: 6px; color: var(--ink-3); font-weight: 500; }
  .search { position: relative; flex: 0 1 300px; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
  .search .input { padding-left: 34px; }

  .dropzone { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; background: color-mix(in srgb, var(--canvas) 80%, transparent); }
  .dropzone.on { display: grid; }
  .dropzone div { border: 2px dashed var(--ink-3); border-radius: 16px; padding: 44px 64px; background: var(--surface); font-weight: 600; text-align: center; }
  .dropzone div span { display: block; font-weight: 400; color: var(--ink-2); margin-top: 4px; }
  .note-line { font-size: 12.5px; color: var(--ink-3); margin-top: 14px; }

  /* ============================================================ invoice review */
  .review { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
  .review-top { display: flex; align-items: center; gap: 10px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
  .crumb { color: var(--ink-3); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumb b { color: var(--ink); font-weight: 600; }
  .grow { flex: 1; }
  .review-body { display: grid; grid-template-columns: minmax(400px, 480px) 1fr; min-height: 0; }
  .detail { overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .detail-body { padding: 22px 24px 18px; flex: 1; }
  .amount { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; margin: 12px 0 10px; }
  .amount small { font-size: 14px; font-weight: 500; color: var(--ink-3); margin-left: 6px; letter-spacing: 0; }
  .facts { color: var(--ink-2); font-size: 13.5px; margin-top: 4px; }

  .advice { border-radius: 10px; padding: 14px 16px; margin-top: 18px; border: 1px solid; }
  .advice.ok { background: var(--ok-bg); border-color: var(--ok-line); }
  .advice.warn { background: var(--warn-bg); border-color: var(--warn-line); }
  .advice.bad { background: var(--bad-bg); border-color: var(--bad-line); }
  .advice .verdict { font-size: 15px; }
  .advice p { margin-top: 6px; }
  .advice ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }

  /* the auditor's margin: a tick, a flag or a cross beside each check */
  .checks { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .checks li { display: grid; grid-template-columns: 26px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .checks .name { font-weight: 600; font-size: 14px; }
  .checks .msg { color: var(--ink-2); font-size: 13.5px; }
  .mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
  .m-pass { background: var(--ok-bg); color: var(--ok); }
  .m-warn { background: var(--warn-bg); color: var(--warn); }
  .m-fail { background: var(--bad-bg); color: var(--bad); }
  .m-skip { background: var(--skip-bg); color: var(--skip); }

  dl.fields { margin: 0; display: grid; grid-template-columns: 136px 1fr; border-top: 1px solid var(--line); font-size: 14px; }
  dl.fields dt, dl.fields dd { margin: 0; padding: 8px 0; border-bottom: 1px solid var(--line); }
  dl.fields dt { color: var(--ink-3); }
  dl.fields dd { font-weight: 500; overflow-wrap: anywhere; }
  .missing { color: var(--ink-3); font-weight: 400; font-style: italic; }
  .notes { font-size: 13px; color: var(--ink-2); margin-top: 10px; display: grid; gap: 4px; }

  details.trace-box summary { cursor: pointer; font-weight: 600; font-size: 14.5px; margin: 28px 0 10px; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.trace-box summary::-webkit-details-marker { display: none; }
  details.trace-box summary svg { transition: transform .15s; }
  details.trace-box[open] summary svg { transform: rotate(90deg); }
  ol.trace { margin: 0; padding: 0; list-style: none; border-left: 2px solid var(--line); margin-left: 6px; }
  ol.trace li { padding: 0 0 12px 16px; position: relative; font-size: 13.5px; }
  ol.trace li::before { content: ""; position: absolute; left: -6px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink-3); }
  ol.trace b { font-weight: 600; }
  ol.trace .t { color: var(--ink-3); font-size: 12.5px; }

  ul.hist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  ul.hist li { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  ul.hist .actor { font-weight: 600; }
  ul.hist .when { color: var(--ink-3); font-size: 12.5px; display: block; }

  .decide { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 14px 24px 16px; display: grid; gap: 10px; }
  .decide .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .stamp { border: 1px solid; border-radius: var(--radius); padding: 10px 12px; font-size: 13.5px; }
  .stamp.ok { background: var(--ok-bg); border-color: var(--ok-line); }
  .stamp.ok b { color: var(--ok); }
  .stamp.bad { background: var(--bad-bg); border-color: var(--bad-line); }
  .stamp.bad b { color: var(--bad); }
  .stamp.flash { animation: settle 1.2s ease-out 1; }
  @keyframes settle { from { box-shadow: 0 0 0 4px color-mix(in srgb, var(--ink-3) 30%, transparent); } to { box-shadow: 0 0 0 0 transparent; } }
  .hint { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: flex-start; }
  .hint svg { margin-top: 2px; color: var(--ink-3); }

  .docpane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface-3); }
  .docbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 20px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 13.5px; color: var(--ink-2); }
  .docbar b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc { flex: 1; min-height: 0; overflow: auto; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .doc img { max-width: min(100%, 900px); height: auto; background: #fff; border-radius: 4px; box-shadow: 0 1px 3px rgba(16,24,40,.12), 0 0 0 1px rgba(16,24,40,.06); }

  /* ============================================================ misc pages */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .metric { padding: 18px; }
  .metric .label { font-size: 13px; color: var(--ink-3); }
  .metric .value { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; margin-top: 2px; }
  .meter { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin-top: 12px; }
  .meter i { display: block; height: 100%; background: var(--ink-2); }
  .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end; }
  .inline-actions { display: flex; gap: 4px; justify-content: flex-end; }
  .kv { display: grid; grid-template-columns: 180px 1fr; gap: 8px 16px; font-size: 14px; }
  .kv dt { color: var(--ink-3); } .kv dd { margin: 0; }
  .remaining { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
  .remaining .meter { width: 80px; margin: 0; }

  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--surface); color: var(--ink); width: min(440px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(10, 14, 20, .45); }
  dialog form { display: grid; gap: 14px; padding: 22px; }

/* ------------------------------------------------------------ formatting */
function money(v, cur) {
  if (v == null) return null;
  try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur || "USD", currencyDisplay: "code" }).format(v).replace(/ /g, " "); }
  catch { return Number(v).toLocaleString(undefined, { minimumFractionDigits: 2 }) + (cur ? " " + cur : ""); }
}
function prettyBank(v) {
  if (!v) return v;
  const [acct, ifsc] = String(v).split("/").map(x => x.trim());
  const a = /^[A-Z]{2}\d{2}[A-Z0-9]{8,}$/.test(acct) ? acct.replace(/(.{4})/g, "$1 ").trim() : acct;
  return ifsc ? `${a} (IFSC ${ifsc})` : a;
}
const plain = v => v == null ? null : Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function when(ts) { const d = new Date(ts); return isNaN(d) ? (ts || "") : d.toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
const initials = n => String(n || "?").split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const pct = (a, b) => b ? Math.min(100, Math.round(100 * a / b)) : 0;

let toastTimer;
function toast(msg, kind = "") { const t = $("#toast"); t.textContent = msg; t.className = "toast " + kind; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 7000); }

/* ------------------------------------------------------------ talking to the server */
let ME = null, CFG = null, HEALTH = null;
const can = p => !!ME && ME.permissions.includes(p);

async function api(path, opts = {}) {
  const o = { ...opts, headers: { ...(opts.headers || {}) }, credentials: "same-origin" };
  if (o.method && o.method !== "GET") o.headers["X-InPro-CSRF"] = "1";          // required for every change
  if (o.json !== undefined) { o.body = JSON.stringify(o.json); o.headers["Content-Type"] = "application/json"; delete o.json; }
  let r;
  try { r = await fetch(path, o); } catch { throw new Error("Cannot reach the server. Check that it is running."); }
  if (r.status === 401 && !path.startsWith("/api/auth/")) { ME = null; showLogin("Your session has ended. Please sign in again."); throw new Error("Please sign in."); }
  if (!r.ok) { let d = ""; try { d = (await r.json()).detail; } catch {} if (Array.isArray(d)) d = d.map(x => x.msg).join("; "); throw new Error(d || `Request failed (${r.status})`); }
  return r.json();
}

async function uploadFiles(files) {
  if (!files.length || !can("upload")) return;
  const btn = $("#uploadBtn"); if (btn) btn.disabled = true;
  let last = null, done = 0;
  for (const f of files) {
    if (btn) btn.innerHTML = `${I.upload}Reading ${done + 1} of ${files.length}…`;
    const fd = new FormData(); fd.append("file", f);
    try { last = await api("/api/invoices", { method: "POST", body: fd }); done++; }
    catch (e) { toast(`${f.name}: ${e.message}`, "bad"); }
  }
  if (btn) { btn.disabled = false; btn.innerHTML = `${I.upload}Upload invoices`; }
  if (!done) return;
  if (files.length === 1 && last) { location.hash = "#/invoice/" + last.id; toast("Read and checked. The recommendation is on the left.", "ok"); }
  else { filter = "all"; toast(`${done} invoice${done > 1 ? "s" : ""} read and checked.`, "ok"); route(); }
}

};

const listNames = names => { const n = names.map(k => CHECK_NAME[k] || k); return n.length > 1 ? n.slice(0, -1).join(", ") + " and " + n[n.length - 1] : (n[0] || ""); };

/* mark what changed: the common start and end stay plain, the middle is highlighted */
function diffMark(from, to) {
  from = String(from || ""); to = String(to || "");
  let i = 0; while (i < from.length && i < to.length && from[i] === to[i]) i++;
  let j = 0; while (j < from.length - i && j < to.length - i && from[from.length - 1 - j] === to[to.length - 1 - j]) j++;
  const mid = to.slice(i, to.length - j);
  return esc(to.slice(0, i)) + (mid ? `<mark>${esc(mid)}</mark>` : "") + esc(to.slice(to.length - j));
}

      const iw = lw * scale, ih = iw * img.naturalHeight / img.naturalWidth;
      const x = Math.min(0, Math.max(lw - iw, lw / 2 - (+el.dataset.x) * iw));
      const y = Math.min(0, Math.max(lh - ih, lh / 2 - (+el.dataset.y) * ih));
      el.style.backgroundImage = `url("${el.dataset.src}")`;
      el.style.backgroundSize = `${iw}px ${ih}px`;

  });
}

  if (r.alone === null) depth = "Duplicates can only be caught by comparing with invoices already received. The genuine invoice was on file, so this is exactly the check that should catch it.";
  else if (r.alone.outcome === "reject") depth = `<b>Even with no earlier invoices on file</b>, ${esc(listNames(r.alone.caught_by))} would still have stopped it on ${r.alone.caught_by.length > 1 ? "their" : "its"} own.`;
  else if (r.alone.outcome === "needs_review") depth = "<b>With no earlier invoices on file</b>, it would still have been held for a person.";
  else depth = "<b>With no earlier invoices on file</b>, it would have got through: here it was the invoice history that caught it.";
  box.innerHTML = `
    <div class="outcome ${o.cls}"><span class="ring">${o.icon}</span>
      <div><div class="word">${o.word}</div><div class="sub">${o.sub}. Checked in ${secs} s.</div></div></div>
    <div class="why">
      ${r.caught_by.length ? `<div class="by">Caught by <b>${esc(listNames(r.caught_by))}</b></div>`
        : r.warned.length ? `<div class="by">Flagged by <b>${esc(listNames(r.warned.filter(n => n !== "completeness")))}</b></div>` : `<div class="by">No check objected.</div>`}
      <q>${esc((hit && hit.message) || failMsg || r.summary.replace(/^(Recommend \w+|Needs HUMAN REVIEW): ?/, ""))}</q>
    </div>
    ${sender ? `<dl class="mailhead">
      <div><dt>From</dt><dd>${esc(r.vendor)} &lt;${realDomain ? esc(sender.split("@")[0]) + "@" + diffMark(realDomain, sender.split("@")[1]) : esc(sender)}&gt;</dd></div>
      ${realDomain ? `<div><dt>Real</dt><dd class="muted">${esc(realDomain)}</dd></div>` : ""}
      <div><dt>Subject</dt><dd>${esc(r.trick === "scam" ? "URGENT: updated bank details" : "Invoice")}</dd></div></dl>` : ""}
    ${labSheets(r)}
    <div class="checkrow" aria-label="All eight checks">${r.checks.map((c, i) => { const [cls, icon] = CHIP_FOR[c.status] || CHIP_FOR.skip;
      return `<span class="chip ${cls}" style="animation-delay:${i * 55}ms" tabindex="0" data-tip="${esc(c.message)}">${icon}${esc(CHECK_NAME[c.name] || c.name)}</span>`; }).join("")}</div>
    <div class="depth"><div>${depth}</div>${r.baseline_added ? `<div class="muted">The genuine invoice was put on file first, as if it had arrived last week.</div>` : ""}</div>`;
  labLoupes();
}

async function labForge() {
  if (LAB.busy) return;
  const btn = $("#forge");
  LAB.busy = true; LAB.last = null; btn.disabled = true; btn.textContent = "Forging and checking…"; labResult();
  try {
    const value = (LAB.values[LAB.trick] || "").trim();
    LAB.last = await api("/api/lab/forge", { method: "POST", json: { base: LAB.base, trick: LAB.trick, value: value || null } });
    try { const d = await api("/api/lab"); LAB.data.score = d.score; LAB.data.recent = d.recent; } catch {}
  } catch (e) { toast(e.message, "bad"); }
  LAB.busy = false; btn.disabled = false; btn.textContent = "Forge it and run the checks";
  labResult(); labScore(); refreshCount();
  if (LAB.last && matchMedia("(max-width: 960px)").matches) $("#labResult").scrollIntoView({ behavior: "smooth", block: "start" });
}

        <div class="field"><label for="uEmail">Work email</label><input class="input" id="uEmail" type="email" required maxlength="200"></div>
        <div class="field"><label for="uRole">Role</label><select class="input" id="uRole"><option value="approver">Approver</option><option value="viewer">Viewer</option><option value="admin">Admin</option></select></div>
        <div class="field"><label for="uLimit">Approval limit</label><input class="input num" id="uLimit" type="number" min="0" step="1" placeholder="No limit"></div>
        <div class="field"><label for="uPw">Temporary password</label><input class="input" id="uPw" type="password" autocomplete="new-password" required></div>
        <div><button class="btn btn-primary" type="submit">Add user</button></div>
      </form>
      <p class="sub" style="margin-top:10px">Passwords need at least 10 characters with upper- and lower-case letters and a number. Ask the person to change it after their first sign-in.</p>
    </div></div>
    <div class="panel">
      <table><thead><tr><th>Name</th><th>Role</th><th class="r">Approval limit</th><th class="hide-sm">Last sign-in</th><th>Status</th><th></th></tr></thead><tbody>
      ${rows.map(u => `<tr><td><span class="cell-title">${esc(u.name)}</span><div class="sub">${esc(u.email)}</div></td>
        <td>${esc(ROLE_TXT[u.role] || u.role)}</td>
        <td class="r num">${u.role === "approver" ? (u.approval_limit != null ? esc(plain(u.approval_limit)) : "No limit") : '<span class="muted">-</span>'}</td>
        <td class="hide-sm sub">${u.last_login ? esc(when(u.last_login)) : "Never"}</td>
        <td>${!u.active ? '<span class="pill p-neutral">Disabled</span>' : u.locked ? '<span class="pill p-rejected">Locked</span>' : '<span class="pill p-approved">Active</span>'}</td>
        <td><div class="inline-actions">${u.id === ME.user.id ? '<span class="sub">You</span>' : `
          <button class="btn btn-ghost btn-sm" data-act="pw" data-id="${u.id}" type="button">Reset password</button>
          <button class="btn btn-ghost btn-sm${u.active ? " btn-danger" : ""}" data-act="toggle" data-id="${u.id}" data-active="${u.active ? 1 : 0}" type="button">${u.active ? "Disable" : "Enable"}</button>`}</div></td></tr>`).join("")}
      </tbody></table>
    </div></div>`;
  $("#uForm").onsubmit = async e => {
    e.preventDefault();
    const lim = $("#uLimit").value;
    try { await api("/api/users", { method: "POST", json: { name: $("#uName").value.trim(), email: $("#uEmail").value.trim(), role: $("#uRole").value, approval_limit: lim === "" ? null : Number(lim), password: $("#uPw").value } }); toast("User added. They can sign in now.", "ok"); usersPage(); }
    catch (ex) { toast(ex.message, "bad"); }
  };
  $$("[data-act]").forEach(b => b.onclick = async () => {
    const id = b.dataset.id;
    try {
      if (b.dataset.act === "toggle") { await api(`/api/users/${id}`, { method: "PATCH", json: { active: b.dataset.active !== "1" } }); toast(b.dataset.active === "1" ? "User disabled and signed out." : "User enabled.", "ok"); }
      else { const pw = prompt("New temporary password (at least 10 characters, upper- and lower-case letters and a number):"); if (!pw) return; await api(`/api/users/${id}`, { method: "PATCH", json: { password: pw } }); toast("Password reset. The user was signed out everywhere.", "ok"); }
      usersPage();
    } catch (ex) { toast(ex.message, "bad"); }
  });
}

/* ============================================================ change password */
function openPassword() {
  const d = $("#pwDialog"); $("#pwForm").reset(); $("#pwErr").hidden = true; d.showModal(); $("#pwCur").focus();
}
$("#pwCancel").onclick = () => $("#pwDialog").close();
$("#pwForm").onsubmit = async e => {
  e.preventDefault();
  const err = $("#pwErr");
  if ($("#pwNew").value !== $("#pwNew2").value) { err.textContent = "The two new passwords are different."; err.hidden = false; return; }
  try { await api("/api/auth/password", { method: "POST", json: { current: $("#pwCur").value, new: $("#pwNew").value } }); $("#pwDialog").close(); toast("Password changed. Other devices were signed out.", "ok"); }
  catch (ex) { err.textContent = ex.message; err.hidden = false; }
};

/* ============================================================ routing and start-up */
function route() {
  if (!ME) return;
  const h = location.hash;
  const m = h.match(/^#\/invoice\/(\d+)/);
  if (m) return reviewPage(m[1]);
  if (h.startsWith("#/invoices")) return invoicesPage();
  if (h.startsWith("#/inbox")) return inboxPage();
  if (h.startsWith("#/lab")) return labPage();
  if (h.startsWith("#/vendors")) return vendorsPage();
  if (h.startsWith("#/pos")) return posPage();
  if (h.startsWith("#/activity")) return activityPage();
  if (h.startsWith("#/ai")) return aiPage();
  if (h.startsWith("#/users")) return usersPage();
  return overviewPage();
}
window.addEventListener("hashchange", route);
$("#file").onchange = e => { uploadFiles([...e.target.files]); e.target.value = ""; };

// drag and drop anywhere on the Invoices page
let dragDepth = 0;
const onInvoices = () => ME && can("upload") && location.hash.startsWith("#/invoices");
window.addEventListener("dragenter", e => { if (!onInvoices() || ![...(e.dataTransfer?.types || [])].includes("Files")) return; dragDepth++; $("#dropzone").classList.add("on"); });
window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("#dropzone").classList.remove("on"); });
window.addEventListener("dragover", e => { if (onInvoices()) e.preventDefault(); });
window.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("#dropzone").classList.remove("on"); if (onInvoices()) uploadFiles([...e.dataTransfer.files]); });

async function boot() {
  try { CFG = await api("/api/auth/config"); } catch (e) { $("#root").innerHTML = `<div class="login"><div class="login-box"><div class="login-card"><h1>Server not reachable</h1><p class="muted" style="margin-top:8px">${esc(e.message)}</p></div></div></div>`; return; }
  try { ME = await api("/api/auth/me"); } catch { ME = null; }
  if (!ME || !ME.user) { ME = null; return showLogin(); }
  try { HEALTH = await api("/api/health"); } catch { HEALTH = null; }
  shell();
  refreshCount();
  route();
}
boot();
</script>
</body>
</html>
