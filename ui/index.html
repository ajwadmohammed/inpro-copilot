<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InPro Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================ tokens */
  :root {
    --canvas: #f2f3f5;  --surface: #ffffff;  --surface-2: #f7f8fa;  --surface-3: #eef0f3;
    --ink: #1a1f27;     --ink-2: #4a5260;    --ink-3: #6e7683;
    --line: #e3e6ea;    --line-2: #cdd2d9;
    --primary: #1f2a37; --primary-hover: #2c3a4a; --on-primary: #ffffff;
    --ok: #1d7a4e;   --ok-bg: #e7f4ed;   --ok-line: #b9dfca;
    --warn: #935700; --warn-bg: #fbf1de; --warn-line: #ecd3a3;
    --bad: #b42318;  --bad-bg: #fdeceb;  --bad-line: #f3c2bd;
    --skip: #6e7683; --skip-bg: #eef0f3;
    --focus: #3d6fb6;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06);
    --font: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #0f1216;  --surface: #161a20;  --surface-2: #1b2027;  --surface-3: #222831;
      --ink: #e7eaee;     --ink-2: #a9b1bc;    --ink-3: #7e8794;
      --line: #262c35;    --line-2: #353c47;
      --primary: #e7eaee; --primary-hover: #ffffff; --on-primary: #11151a;
      --ok: #4cc38a;   --ok-bg: #11281d;   --ok-line: #1f4a35;
      --warn: #e5a443; --warn-bg: #2b2111; --warn-line: #4f3b17;
      --bad: #f2766b;  --bad-bg: #321614;  --bad-line: #5a2622;
      --skip: #7e8794; --skip-bg: #222831;
      --focus: #7aa7e6;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }

  /* ============================================================ base */
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 14.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .muted { color: var(--ink-3); }
  .sub { color: var(--ink-3); font-size: 13px; }
  h1 { font-size: 22px; line-height: 1.25; margin: 0; letter-spacing: -0.01em; font-weight: 600; }
  h2 { font-size: 14.5px; font-weight: 600; margin: 28px 0 10px; }
  p { margin: 0; }
  svg { flex: none; }

  /* ============================================================ buttons: one system everywhere */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px;
         border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
         font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap;
         transition: background .12s, border-color .12s; }
  .btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-approve { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn-approve:hover { background: color-mix(in srgb, var(--ok) 88%, #000); border-color: transparent; }
  .btn-reject { color: var(--bad); border-color: var(--bad-line); }
  .btn-reject:hover { background: var(--bad-bg); border-color: var(--bad); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); padding: 0 10px; }
  .btn-ghost:hover { background: var(--surface-3); border-color: transparent; color: var(--ink); }
  .btn-danger { color: var(--bad); }
  .btn-sm { height: 30px; padding: 0 10px; font-size: 13px; }
  .btn-block { width: 100%; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  @media (prefers-color-scheme: dark) { .btn-approve { color: #0b1a12; } }

  /* ============================================================ form controls */
  .field { display: grid; gap: 6px; }
  .field label { font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .input, select.input, textarea.input { height: 38px; width: 100%; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--radius);
         background: var(--surface); transition: border-color .12s, box-shadow .12s; }
  textarea.input { height: auto; min-height: 40px; padding: 9px 12px; resize: vertical; }
  .input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
  .input::placeholder { color: var(--ink-3); }
  .form-error { color: var(--bad); font-size: 13.5px; }

  /* ============================================================ sign-in */
  .login { min-height: 100%; display: grid; place-items: center; padding: 40px 16px; }
  .login-box { width: 100%; max-width: 400px; }
  .login-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px; box-shadow: var(--shadow); }
  .login-card h1 { font-size: 20px; margin-bottom: 4px; }
  .signin { min-height: 100%; display: grid; grid-template-rows: 1fr auto; padding: 0 16px; }
  .signin-main { align-self: center; justify-self: center; width: 100%; max-width: 392px; padding: 48px 0 32px; }
  .signin-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15.5px; }
  .signin h1 { font-size: 34px; line-height: 1.12; letter-spacing: -0.025em; font-weight: 600; margin: 44px 0 0; text-wrap: balance; }
  .signin-lede { color: var(--ink-2); font-size: 15.5px; margin-top: 12px; }
  .signin .btn-enter { width: 100%; height: 44px; margin-top: 32px; font-size: 15px; justify-content: center; }
  .signin form { display: grid; gap: 14px; margin-top: 28px; }
  [hidden] { display: none !important; }       /* "hidden" always wins over a layout rule */
  .signin form[hidden] { display: none; }
  .signin .form-error { margin-top: 10px; }
  .linkish { background: none; border: 0; padding: 0; font: inherit; font-size: 13.5px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; margin-top: 18px; }
  .linkish:hover { color: var(--ink); }
  .signin-foot { justify-self: center; text-align: center; font-size: 12px; color: var(--ink-3); padding: 0 0 22px; max-width: 60ch; }
  .who-switch { width: 100%; background: none; border: 1px solid transparent; border-radius: 9px; padding: 6px; margin: -6px; width: calc(100% + 12px); text-align: left; cursor: pointer; color: inherit; font: inherit; }
  .who-switch:hover, .who-switch[aria-expanded="true"] { background: var(--surface-3); }
  .who-switch .swap { margin-left: auto; color: var(--ink-3); flex: none; display: grid; place-items: center; }
  .rolemenu { position: fixed; z-index: 40; width: 236px; max-width: calc(100vw - 24px); background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 12px 32px rgba(16, 24, 40, .16); padding: 6px; }
  .rolemenu[hidden] { display: none; }
  .rolemenu-head { padding: 6px 10px 4px; font-size: 12px; color: var(--ink-3); }
  .rolemenu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; border-radius: 8px; background: none; color: inherit; font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
  .rolemenu button:hover, .rolemenu button:focus-visible { background: var(--surface-3); outline: none; }
  .rolemenu button[aria-checked="true"] { background: var(--surface-2); }
  .rolemenu .avatar { width: 30px; height: 30px; font-size: 11px; }
  .rolemenu b { display: block; font-weight: 600; font-size: 13.5px; line-height: 1.3; }
  .rolemenu small { display: block; font-size: 12px; color: var(--ink-3); line-height: 1.3; }
  .rolemenu .tick { margin-left: auto; color: var(--ok); flex: none; }

  /* ============================================================ app shell */
  .shell { display: grid; grid-template-columns: 236px 1fr; height: 100%; }
  .side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; font-weight: 600; font-size: 15.5px; text-decoration: none; }
  .brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
  .brand small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-3); margin-top: -2px; }
  nav.menu { padding: 6px 10px; display: grid; gap: 2px; }
  .menu a { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 7px; text-decoration: none; color: var(--ink-2); font-weight: 500; }
  .menu a:hover { background: var(--surface-3); color: var(--ink); }
  .menu a[aria-current="page"] { background: var(--surface-3); color: var(--ink); box-shadow: inset 2px 0 0 var(--primary); }
  .menu .count { margin-left: auto; font-size: 12px; font-weight: 600; background: var(--warn-bg); color: var(--warn); border-radius: 99px; padding: 0 8px; line-height: 20px; }
  .menu-label { font-size: 12px; color: var(--ink-3); padding: 14px 20px 4px; }
  .side-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 14px; display: grid; gap: 10px; }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-weight: 600; font-size: 12.5px; color: var(--ink-2); flex: none; }
  .who div b { display: block; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who div span { display: block; font-size: 12px; color: var(--ink-3); }
  .side-actions { display: flex; gap: 4px; }
  .reader { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); padding: 0 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

  main { min-width: 0; min-height: 0; overflow-y: auto; }
  .page { max-width: 1160px; margin: 0 auto; padding: 28px 32px 64px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .page-head p { color: var(--ink-2); margin-top: 4px; max-width: 64ch; }
  .page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ============================================================ panels and tables */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .page > .panel + .panel { margin-top: 16px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { margin: 0; }
  .panel-body { padding: 18px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--ink-3); padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
  th:first-child { border-top-left-radius: 10px; } th:last-child { border-top-right-radius: 10px; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--surface-2); }
  td.r, th.r { text-align: right; }
  td.num, td.r { white-space: nowrap; }
  td .verdict { white-space: nowrap; }
  .cell-title { font-weight: 600; color: var(--ink); text-decoration: none; }
  .empty { padding: 48px 24px; text-align: center; color: var(--ink-2); }
  .empty p { margin-bottom: 16px; }

  /* status, verdicts */
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; height: 24px; padding: 0 10px; border-radius: 99px; white-space: nowrap; border: 1px solid transparent; }
  .step-cell { max-width: 220px; }
  .inv-num { max-width: 150px; overflow-wrap: anywhere; }
  .step-cell .pill { height: auto; min-height: 24px; white-space: normal; line-height: 1.3; padding: 3px 10px; border-radius: 12px; }
  .p-pending  { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
  .p-approved { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-line); }
  .p-rejected { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-line); }
  .p-neutral  { background: var(--surface-3); color: var(--ink-2); }
  .p-task     { background: var(--surface); color: var(--ink); border-color: var(--ink); font-weight: 600; }
  .verdict { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13.5px; }
  .v-ok { color: var(--ok); } .v-warn { color: var(--warn); } .v-bad { color: var(--bad); }

  /* the queue summary */
  .summary { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding: 16px 18px; }
  .bar { flex: 1 1 260px; display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-3); }
  .bar i { display: block; height: 100%; }
  .legend { display: flex; gap: 6px 20px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); }
  .legend b { color: var(--ink); font-weight: 600; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; background: var(--surface-3); border-radius: 9px; padding: 3px; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .seg button { border: 0; background: transparent; height: 30px; padding: 0 12px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: 13.5px; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .seg small { margin-left: 6px; color: var(--ink-3); font-weight: 500; }
  .search { position: relative; flex: 0 1 300px; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
  .search .input { padding-left: 34px; }

  .dropzone { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; background: color-mix(in srgb, var(--canvas) 80%, transparent); }
  .dropzone.on { display: grid; }
  .dropzone div { border: 2px dashed var(--ink-3); border-radius: 16px; padding: 44px 64px; background: var(--surface); font-weight: 600; text-align: center; }
  .dropzone div span { display: block; font-weight: 400; color: var(--ink-2); margin-top: 4px; }
  .note-line { font-size: 12.5px; color: var(--ink-3); margin-top: 14px; }

  /* ============================================================ invoice review */
  .review { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
  .review-top { display: flex; align-items: center; gap: 10px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
  .crumb { color: var(--ink-3); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumb b { color: var(--ink); font-weight: 600; }
  .grow { flex: 1; }
  .review-body { display: grid; grid-template-columns: minmax(400px, 480px) 1fr; min-height: 0; }
  .detail { overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .detail-body { padding: 22px 24px 18px; flex: 1; }
  .amount { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; margin: 12px 0 10px; }
  .amount small { font-size: 14px; font-weight: 500; color: var(--ink-3); margin-left: 6px; letter-spacing: 0; }
  .facts { color: var(--ink-2); font-size: 13.5px; margin-top: 4px; }

  .advice { border-radius: 10px; padding: 14px 16px; margin-top: 18px; border: 1px solid; }
  .advice.ok { background: var(--ok-bg); border-color: var(--ok-line); }
  .advice.warn { background: var(--warn-bg); border-color: var(--warn-line); }
  .advice.bad { background: var(--bad-bg); border-color: var(--bad-line); }
  .advice .verdict { font-size: 15px; }
  .advice p { margin-top: 6px; }
  .advice ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }

  /* the auditor's margin: a tick, a flag or a cross beside each check */
  .checks { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .checks li { display: grid; grid-template-columns: 26px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .checks .name { font-weight: 600; font-size: 14px; }
  .checks .msg { color: var(--ink-2); font-size: 13.5px; }
  .mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
  .m-pass { background: var(--ok-bg); color: var(--ok); }
  .m-warn { background: var(--warn-bg); color: var(--warn); }
  .m-fail { background: var(--bad-bg); color: var(--bad); }
  .m-skip { background: var(--skip-bg); color: var(--skip); }

  dl.fields { margin: 0; display: grid; grid-template-columns: 136px 1fr; border-top: 1px solid var(--line); font-size: 14px; }
  dl.fields dt, dl.fields dd { margin: 0; padding: 8px 0; border-bottom: 1px solid var(--line); }
  dl.fields dt { color: var(--ink-3); }
  dl.fields dd { font-weight: 500; overflow-wrap: anywhere; }
  .missing { color: var(--ink-3); font-weight: 400; font-style: italic; }
  .notes { font-size: 13px; color: var(--ink-2); margin-top: 10px; display: grid; gap: 4px; }

  details.trace-box summary { cursor: pointer; font-weight: 600; font-size: 14.5px; margin: 28px 0 10px; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.trace-box summary::-webkit-details-marker { display: none; }
  details.trace-box summary svg { transition: transform .15s; }
  details.trace-box[open] summary svg { transform: rotate(90deg); }
  ol.trace { margin: 0; padding: 0; list-style: none; border-left: 2px solid var(--line); margin-left: 6px; }
  ol.trace li { padding: 0 0 12px 16px; position: relative; font-size: 13.5px; }
  ol.trace li::before { content: ""; position: absolute; left: -6px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink-3); }
  ol.trace b { font-weight: 600; }
  ol.trace .t { color: var(--ink-3); font-size: 12.5px; }

  ul.hist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  ul.hist li { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  ul.hist .actor { font-weight: 600; }
  ul.hist .when { color: var(--ink-3); font-size: 12.5px; display: block; }

  .decide { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 14px 24px 16px; display: grid; gap: 10px; }
  .decide .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .stamp { border: 1px solid; border-radius: var(--radius); padding: 10px 12px; font-size: 13.5px; }
  .stamp.ok { background: var(--ok-bg); border-color: var(--ok-line); }
  .stamp.ok b { color: var(--ok); }
  .stamp.bad { background: var(--bad-bg); border-color: var(--bad-line); }
  .stamp.bad b { color: var(--bad); }
  .stamp.flash { animation: settle 1.2s ease-out 1; }
  /* a decided invoice: a short record instead of the review */
  .record { border: 1px solid; border-radius: 10px; padding: 16px 18px; margin-top: 18px; }
  .record.ok { background: var(--ok-bg); border-color: var(--ok-line); }
  .record.bad { background: var(--bad-bg); border-color: var(--bad-line); }
  .record.flash { animation: settle 1.2s ease-out 1; }
  .record-head { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 650; }
  .record.ok .record-head { color: var(--ok); } .record.bad .record-head { color: var(--bad); }
  .record p { margin-top: 6px; }
  .record-note { color: var(--ink-2); }
  .record-why { margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); }
  .record .kvs { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--ok-line); }
  .record.bad .kvs { border-top-color: var(--bad-line); }
  .record .kvs dd .sub { display: block; }
  details.change summary { cursor: pointer; font-size: 13.5px; color: var(--ink-2); list-style: none; width: max-content; }
  details.change summary::-webkit-details-marker { display: none; }
  details.change summary:hover { color: var(--ink); text-decoration: underline; }
  details.change[open] summary { margin-bottom: 10px; }
  details.change { display: grid; gap: 10px; }
  .record.gone { background: var(--surface-2, var(--bg)); border-color: var(--line); }
  .record.gone .record-head { color: var(--ink-2); }
  .record.gone .kvs { border-top-color: var(--line); }
  .remove-box { border: 1px solid var(--bad-line); background: var(--bad-bg); border-radius: 10px; padding: 14px 16px; margin-top: 18px; display: grid; gap: 10px; }
  .remove-box b { color: var(--bad); }
  .remove-box[hidden] { display: none; }
  .sendon { display: grid; gap: 10px; margin-top: 12px; }
  /* review: what looks good / what needs attention */
  .pc { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 14px 0 4px; }
  .pc-col { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; background: var(--surface); }
  .pc-col h3 { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 650; margin: 0 0 6px; }
  .pc-col.good h3 { color: var(--ok); } .pc-col.attn h3 { color: var(--warn); } .pc-col.attn.bad h3 { color: var(--bad); }
  .pc-col h3 svg { width: 15px; height: 15px; }
  .pc-col ul { margin: 0; padding: 0; }
  .pc-col.skip h3 { color: var(--ink-2); }
  .pc-col summary { list-style: none; cursor: pointer; }
  .pc-col summary::-webkit-details-marker { display: none; }
  .pc-col summary h3 { margin-bottom: 2px; }
  .pc-names { display: block; font-size: 13px; color: var(--ink-2); padding-left: 21px; }
  .pc-more { margin-left: 8px; color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px; }
  .pc-col[open] .pc-more { display: none; }
  .pc-col[open] summary { margin-bottom: 4px; }
  .pc-n { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .pc-none { margin: 0; font-size: 13px; color: var(--ink-3); }
  .pc-col .checks { border-top: 0; }
  .pc-col .checks li { padding: 8px 0; }
  .pc-col .checks li:last-child { border-bottom: 0; padding-bottom: 2px; }
  .decide-main { display: grid; gap: 10px; }
  .rej-q { font-size: 13.5px; color: var(--ink-2); }
  .rej-q b { color: var(--bad); }
  .newsup .vcard { margin-top: 0; }
  .done .next { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .done .next svg { width: 15px; height: 15px; color: var(--ink-3); }
  .mini { list-style: none; margin: 0; padding: 0; }
  .mini a { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: baseline; padding: 11px 18px; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 14px; }
  .mini a:hover { background: var(--surface-2); }
  .mini .num { color: var(--ink-2); font-size: 13px; }
  .newsup { border: 1px dashed var(--warn-line); background: var(--warn-bg); border-radius: var(--radius); padding: 12px 14px; margin-top: 12px; }
  .newsup > b { color: var(--warn); }
  .newsup p { margin: 4px 0 10px; font-size: 13.5px; color: var(--ink-2); }
  .miss-note { display: flex; gap: 8px; align-items: flex-start; color: var(--bad); font-size: 13.5px; margin-top: 10px; }
  .review-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .review-actions .grow { flex: 1; }
  .banner { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--ok-line); background: var(--ok-bg); color: var(--ink); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 14px; font-size: 14px; }
  .banner svg { color: var(--ok); flex: none; margin-top: 2px; }
  .banner.bad { border-color: var(--bad-line); background: var(--bad-bg); } .banner.bad svg { color: var(--bad); }
  /* the page after an action: what happened, what comes next */
  .done-page { display: grid; place-items: center; min-height: 70vh; }
  .done { max-width: 560px; text-align: center; display: grid; justify-items: center; gap: 10px; }
  .done-icon { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-line); }
  .done.bad .done-icon { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-line); }
  .done.info .done-icon { background: var(--surface-3); color: var(--ink-2); border-color: var(--line); }
  .done-icon svg { width: 26px; height: 26px; }
  .done h1 { font-size: 24px; margin: 6px 0 0; }
  .done p { color: var(--ink-2); margin: 0; }
  .done .next { margin-top: 2px; font-size: 13.5px; }
  .done .row { justify-content: center; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  /* upload page */
  .upzone { border: 2px dashed var(--line); border-radius: 14px; background: var(--surface); padding: 48px 24px; display: grid; justify-items: center; gap: 10px; text-align: center; transition: border-color .15s, background .15s; }
  .upzone.on, .upzone:focus-visible { border-color: var(--ink-3); background: var(--surface-2); outline: none; }
  .upzone svg { width: 34px; height: 34px; color: var(--ink-3); }
  .upzone b { font-size: 17px; }
  /* notifications */
  .bell { position: relative; margin-left: auto; width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--ink-2); display: grid; place-items: center; cursor: pointer; }
  .bell:hover, .bell[aria-expanded="true"] { background: var(--surface-2); border-color: var(--line); color: var(--ink); }
  .bell svg { width: 18px; height: 18px; }
  .bell .dot { position: absolute; top: 2px; right: 1px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; line-height: 17px; text-align: center; }
  .brand-row { display: flex; align-items: center; gap: 6px; }
  .notes-panel { position: fixed; z-index: 60; width: min(380px, calc(100vw - 24px)); max-height: min(520px, 70vh); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 50px rgba(15, 20, 30, .18); }
  .notes-panel header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 650; }
  .notes-panel ul { list-style: none; margin: 0; padding: 0; }
  .notes-panel li a { position: relative; display: grid; gap: 2px; padding: 10px 14px 10px 28px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 13.5px; }
  .notes-panel li a:hover { background: var(--surface-2); }
  .notes-panel li.unread a { background: color-mix(in srgb, var(--warn-bg) 60%, transparent); }
  .notes-panel li.unread a::before { content: ""; position: absolute; left: 13px; top: 17px; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  .notes-panel .when { color: var(--ink-3); font-size: 12px; }
  .notes-panel .empty { padding: 26px 14px; }
  @media (max-width: 760px) { .pc { grid-template-columns: 1fr; } }
  .open-items { border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: var(--radius); padding: 10px 12px; font-size: 13.5px; }
  .open-items b { color: var(--warn); }
  .open-items summary { cursor: pointer; list-style: none; color: var(--ink-2); }
  .open-items summary::-webkit-details-marker { display: none; }
  .open-items ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); max-height: 30vh; overflow: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 99px; padding: 3px 10px; cursor: pointer; }
  .pick:hover, .pick[aria-pressed="true"] { border-color: var(--ink-3); color: var(--ink); background: var(--surface-2); }
  @keyframes settle { from { box-shadow: 0 0 0 4px color-mix(in srgb, var(--ink-3) 30%, transparent); } to { box-shadow: 0 0 0 0 transparent; } }
  .hint { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: flex-start; }
  .hint svg { margin-top: 2px; color: var(--ink-3); }

  .docpane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface-3); }
  .docbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 20px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 13.5px; color: var(--ink-2); }
  .docbar b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc { flex: 1; min-height: 0; overflow: auto; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .doc img { max-width: min(100%, 900px); height: auto; background: #fff; border-radius: 4px; box-shadow: 0 1px 3px rgba(16,24,40,.12), 0 0 0 1px rgba(16,24,40,.06); }

  /* ============================================================ misc pages */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .metric { padding: 18px; }
  .metric .label { font-size: 13px; color: var(--ink-3); }
  .metric .value { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; margin-top: 2px; }
  .meter { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin-top: 12px; }
  .meter i { display: block; height: 100%; background: var(--ink-2); }
  .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end; }
  .inline-actions { display: flex; gap: 4px; justify-content: flex-end; }
  .kv { display: grid; grid-template-columns: 180px 1fr; gap: 8px 16px; font-size: 14px; }
  .kv dt { color: var(--ink-3); } .kv dd { margin: 0; }
  .remaining { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
  .remaining .meter { width: 80px; margin: 0; }

  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--surface); color: var(--ink); width: min(440px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(10, 14, 20, .45); }
  dialog form { display: grid; gap: 14px; padding: 22px; }
  dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  .toast { position: fixed; right: 20px; bottom: 20px; max-width: min(420px, calc(100vw - 40px)); background: var(--surface); color: var(--ink);
           border: 1px solid var(--line-2); border-left: 4px solid var(--ink-2); border-radius: var(--radius); padding: 12px 14px; font-size: 14px; z-index: 40; box-shadow: 0 8px 24px rgba(0,0,0,.14); }
  .toast.ok { border-left-color: var(--ok); } .toast.bad { border-left-color: var(--bad); }
  .toast[hidden] { display: none; }

  /* ============================================================ overview */
  /* flow palette: validated for colour-vision deficiency in both modes (amber never sits next to red) */
  :root { --f-clear: #1d7a4e; --f-wait: #c48a12; --f-proc: #7a5ab8; --f-people: #3d63a8; --f-stop: #b42318; }
  @media (prefers-color-scheme: dark) { :root { --f-clear: #36a072; --f-wait: #c08a1f; --f-proc: #a088d8; --f-people: #6b8bd6; --f-stop: #e2503f; } }
  .hero { padding: 26px 26px 22px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: end; }
  .hero-label { font-size: 13.5px; color: var(--ink-2); grid-column: 1 / -1; }
  .hero-value { font-size: 52px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .hero-value small { font-size: 22px; font-weight: 500; color: var(--ink-3); margin-right: 6px; letter-spacing: 0; }
  .hero-also { color: var(--ink-2); font-size: 14px; margin-top: 10px; }
  .hero-side { text-align: right; color: var(--ink-2); font-size: 13.5px; }
  .hero-side b { display: block; font-size: 26px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
  .hero-side .fine { display: block; margin-top: 4px; font-size: 12px; color: var(--ink-3); }
  .flow { padding: 0 26px 24px; }
  .flow-title { font-size: 13.5px; color: var(--ink-2); margin-bottom: 10px; }
  .flowbar { display: flex; gap: 2px; height: 14px; }
  .flowbar i { display: block; height: 100%; min-width: 4px; border-radius: 0; cursor: default; }
  .flowbar i:first-child { border-radius: 4px 0 0 4px; } .flowbar i:last-child { border-radius: 0 4px 4px 0; }
  .flowbar i:only-child { border-radius: 4px; }
  .flowbar i:focus-visible { outline-offset: 3px; }
  .flowkey { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
  .flowkey.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .flowkey div { border-top: 2px solid var(--line); padding-top: 10px; font-size: 13.5px; color: var(--ink-2); }
  .flowkey b { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 20px; font-weight: 600; }
  .flowkey .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .two { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
  .ledger { list-style: none; margin: 0; padding: 0; }
  .ledger li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .ledger li:last-child { border-bottom: 0; }
  .ledger a { text-decoration: none; }
  .ledger .amt { font-weight: 600; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ledger .why { grid-column: 1 / -1; color: var(--ink-2); font-size: 13.5px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; grid-column: 1 / -1; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad-line); white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-line); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
  .chip.neutral { background: var(--surface-3); color: var(--ink-2); border-color: var(--line); }
  .statement { margin: 0; }
  .statement div { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .statement div:last-child { border-bottom: 0; }
  .statement dt { color: var(--ink-2); font-size: 13.5px; } .statement dd { margin: 0; font-weight: 600; font-size: 15px; text-align: right; white-space: nowrap; }
  .statement .fine { display: block; font-weight: 400; font-size: 12px; color: var(--ink-3); }
  .rank { list-style: none; margin: 0; padding: 8px 18px 14px; display: grid; gap: 10px; }
  .rank li { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; align-items: center; font-size: 13.5px; }
  .rank .track { display: flex; align-items: center; gap: 8px; }
  .rank .bar-h { height: 8px; border-radius: 0 4px 4px 0; background: var(--f-stop); min-width: 4px; }
  .rank .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12.5px; padding: 6px 9px; border-radius: 6px; max-width: 280px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .tip[hidden] { display: none; }

  .source-line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--ink-2); margin-top: 8px; }

  /* ============================================================ hand-offs: who has done what, and whose turn it is */
  .handoff { list-style: none; margin: 18px 0 2px; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
  .handoff li { position: relative; padding-top: 28px; min-width: 0; }
  .handoff li::after { content: ""; position: absolute; top: 10px; left: 26px; right: 2px; height: 2px; border-radius: 2px; background: var(--line-2); }
  .handoff li:last-child::after { display: none; }
  .handoff li.done::after { background: var(--ink-2); }
  .handoff .pip { position: absolute; top: 0; left: 0; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
                  border: 2px solid var(--line-2); background: var(--surface); color: var(--surface); }
  .handoff .pip svg { width: 12px; height: 12px; }
  .handoff li.done .pip { background: var(--ink-2); border-color: var(--ink-2); }
  .handoff li.current .pip { border-color: var(--ink); box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 11px var(--ink); }
  .handoff b { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.3; color: var(--ink); }
  .handoff li.todo b { color: var(--ink-3); font-weight: 500; }
  .handoff span:not(.pip) { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 12px; line-height: 1.35; color: var(--ink-3); overflow: hidden; }
  .handoff li.current span:not(.pip) { color: var(--ink); font-weight: 500; }
  .task { margin-top: 14px; padding: 14px 16px; border: 1px solid var(--line-2); border-left: 3px solid var(--ink); border-radius: 0 10px 10px 0; background: var(--surface-2); }
  .task.waiting { border-left-color: var(--line-2); }
  .task-head { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .task-head svg { color: var(--ink-2); }
  .task p { margin-top: 6px; font-size: 13.5px; color: var(--ink-2); }
  .task .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .task > .input { margin-top: 10px; height: 34px; }
  .vcard { display: grid; gap: 10px; margin-top: 12px; }
  .vcard .input { height: 34px; }
  .vhint { font-size: 12px; color: var(--ink-3); min-height: 0; }
  .vrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .reqform { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; margin-top: 10px; }
  .reqform .wide { grid-column: span 2; }
  .reqform .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  tr.req-open td { background: var(--surface-2); }
  .req-why { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
  .tag-atf { display: inline-block; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); border-radius: 4px; padding: 0 6px; font-size: 12px; font-weight: 600; line-height: 18px; }
  .vhint.ok { color: var(--ok); } .vhint.bad { color: var(--bad); } .vhint.warn { color: var(--warn); }
  .kvs { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 4px 12px; margin: 10px 0 0; font-size: 13.5px; }
  .kvs dt { color: var(--ink-3); } .kvs dd { margin: 0; overflow-wrap: anywhere; }
  .h2row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .h2row h2 { margin: 28px 0 10px; }
  .fieldform { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 8px 12px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; font-size: 14px; }
  .fieldform label { color: var(--ink-3); }
  .fieldform .input { height: 34px; }
  .fieldform .row { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 4px; }
  .chip.edited { height: 18px; font-size: 11px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; cursor: default; }
  .show-sm { display: none; }

  /* ============================================================ proof on the document */
  .proof { margin-top: 16px; display: grid; gap: 12px; }
  .proof-item { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
  .proof-head { display: flex; align-items: center; gap: 8px; padding: 11px 14px; font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--line); }
  .proof-head svg { flex: none; }
  .proof-item.fail .proof-head { color: var(--bad); } .proof-item.warn .proof-head { color: var(--warn); }
  .proof-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 4px 0 0; }
  .proof-table th, .proof-table td { text-align: left; padding: 7px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .proof-table thead th { font-weight: 500; color: var(--ink-3); font-size: 12px; padding-top: 8px; padding-bottom: 6px; }
  .proof-table tbody th { font-weight: 500; color: var(--ink-2); width: 30%; }
  .proof-table td { font: 500 13px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; overflow-wrap: anywhere; }
  .proof-table td.ref { color: var(--ink-3); }
  .proof-table mark { background: var(--bad-bg); color: var(--bad); border-radius: 2px; padding: 0 1px; }
  .proof-shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; padding: 12px 14px 14px; }
  .shot { margin: 0; min-width: 0; }
  .shot figcaption { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }
  .shot figcaption a { color: var(--ink-2); }
  .zoom { position: relative; height: 78px; border-radius: 6px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px var(--line); }
  .zoom img { position: absolute; left: 0; top: 0; max-width: none; }
  .zoom .hit { position: absolute; border: 2px solid var(--bad); border-radius: 3px; background: rgba(180, 35, 24, .08); animation: hit-in .5s cubic-bezier(.2, .8, .2, 1) both .1s; }
  .zoom.ref .hit { border: 1.5px dashed #6e7683; background: rgba(110, 118, 131, .08); animation: none; }
  .zoom:not(.ready) .hit { visibility: hidden; }
  @keyframes hit-in { from { transform: scale(1.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .zoom .hit { animation: none; } }

  /* the blinking text cursor: only where you can actually type */
  body { caret-color: transparent; }
  input, textarea, select, [contenteditable="true"] { caret-color: auto; }

  /* ============================================================ small screens */
  @media (max-width: 960px) {
    .shell { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .side { flex-direction: row; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
    .brand { padding: 10px 14px; white-space: nowrap; } .brand small { display: none; }
    .panel { overflow-x: auto; }
    .panel table { min-width: 560px; }

function money(v, cur) {
  if (v == null) return null;
  try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur || "USD", currencyDisplay: "code" }).format(v).replace(/ /g, " "); }
  catch { return Number(v).toLocaleString(undefined, { minimumFractionDigits: 2 }) + (cur ? " " + cur : ""); }
}
function prettyBank(v) {
  if (!v) return v;

}

async function api(path, opts = {}) {

  if (o.method && o.method !== "GET") o.headers["X-InPro-CSRF"] = "1";          // required for every change
  if (o.json !== undefined) { o.body = JSON.stringify(o.json); o.headers["Content-Type"] = "application/json"; delete o.json; }
  let r;
  try { r = await fetch(path, o); } catch { throw new Error("Cannot reach the server. Check that it is running."); }
  if (r.status === 401 && !path.startsWith("/api/auth/")) { ME = null; showLogin("Your session has ended. Please sign in again."); throw new Error("Please sign in."); }
  if (!r.ok) { let d = ""; try { d = (await r.json()).detail; } catch {} if (Array.isArray(d)) d = d.map(x => x.msg).join("; "); throw new Error(d || `Request failed (${r.status})`); }

}

function roleSwitcher() {
  const btn = $("#whoBtn"), menu = $("#roleMenu");
  const close = () => { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); };
  const open = () => {
    const r = btn.getBoundingClientRect();
    menu.hidden = false; btn.setAttribute("aria-expanded", "true");
    const w = menu.offsetWidth, clamp = x => Math.min(Math.max(12, x), innerWidth - w - 12);
    if (r.top > innerHeight / 2) { menu.style.top = ""; menu.style.bottom = (innerHeight - r.top + 8) + "px"; menu.style.left = clamp(r.left) + "px"; }
    else { menu.style.bottom = ""; menu.style.top = (r.bottom + 8) + "px"; menu.style.left = clamp(r.right - w) + "px"; }
    (menu.querySelector('[aria-checked="true"]') || menu.querySelector("button")).focus();
  };
  btn.onclick = e => { e.stopPropagation(); menu.hidden ? open() : close(); };
  document.addEventListener("click", e => { if (!menu.hidden && !menu.contains(e.target)) close(); });
  menu.addEventListener("keydown", e => {
    const items = [...menu.querySelectorAll("button")], i = items.indexOf(document.activeElement);
    if (e.key === "Escape") { close(); btn.focus(); }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus(); }
  });
  menu.querySelectorAll("[data-switch]").forEach(b => b.onclick = async () => {
    if (b.getAttribute("aria-checked") === "true") return close();
    b.disabled = true;
    try {
      const r = await api("/api/auth/switch", { method: "POST", json: { email: b.dataset.switch } });
      filter = null;                       // each person's queue opens on their own tasks
      await boot();
      toast(`Now seeing the app as ${r.user.name} (${ROLE_TXT[r.user.role] || r.user.role}).`, "ok");
    } catch (ex) { b.disabled = false; toast(ex.message, "bad"); }
  });
}
