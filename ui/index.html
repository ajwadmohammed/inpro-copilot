  const s = stats.by_status, total = stats.total || 0;
  const seg = (n, c) => `<i style="width:${total ? 100 * n / total : 0}%;background:var(${c})"></i>`;
  const who = b => { const p = [b.checks ? `${b.checks} by the checks` : "", b.person ? `${b.person} by a person` : ""].filter(Boolean); return p.length ? ` <span class="muted">(${p.join(", ")})</span>` : ""; };
  const pick = st => st === "mine" ? myTask : st === "all" ? () => true : r => r.status === st;
  const visible = rows.filter(pick(filter));
  const count = st => rows.filter(pick(st)).length;
  const c = $("#pendingCount"); if (c) { c.textContent = stats.my_tasks; c.hidden = !stats.my_tasks; }

  box.innerHTML = `
    ${total ? `<div class="panel summary">
      <div class="bar" role="img" aria-label="${s.approved} approved, ${s.pending} waiting, ${s.rejected} rejected">${seg(s.approved, "--ok")}${seg(s.pending, "--warn")}${seg(s.rejected, "--bad")}</div>
      <div class="legend">
        <span><span class="dot" style="background:var(--warn)"></span><b>${s.pending}</b> waiting for a person</span>
        <span><span class="dot" style="background:var(--ok)"></span><b>${s.approved}</b> approved${who(stats.approved_by)}</span>
        <span><span class="dot" style="background:var(--bad)"></span><b>${s.rejected}</b> rejected${who(stats.rejected_by)}</span>
      </div></div>` : ""}
    <div class="panel" style="margin-top:16px">
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Show">
          ${[...(ME.user.role === "viewer" ? [] : [["mine", "My tasks"]]), ["pending", "Waiting"], ["approved", "Approved"], ["rejected", "Rejected"], ["all", "All"]].map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${filter === k}">${l}<small>${count(k)}</small></button>`).join("")}
        </div>
        <div class="search">${I.search}<label class="sr" for="q">Search invoices</label><input class="input" id="q" type="search" placeholder="Search vendor or invoice number" value="${esc(query)}"></div>
      </div>
      ${visible.length ? `<table><thead><tr><th>Vendor</th><th>Invoice</th><th class="hide-sm">Date</th><th class="r">Amount</th><th>AI recommendation</th><th class="hide-sm">Status or next step</th></tr></thead><tbody>
        ${visible.map(r => { const o = OUTCOME[r.ai_outcome] || OUTCOME.needs_review; return `<tr class="click" data-id="${r.id}">
          <td><a class="cell-title" href="#/invoice/${r.id}">${esc(r.vendor || "Vendor not found")}</a><div class="sub">${esc(r.filename)}</div></td>
          <td class="num inv-num">${r.invoice_number ? esc(r.invoice_number) : (r.waived || []).includes("invoice_number") ? NOT_PRINTED : MISSING}</td>
          <td class="num hide-sm">${r.invoice_date ? esc(r.invoice_date) : (r.waived || []).includes("invoice_date") ? NOT_PRINTED : MISSING}</td>
          <td class="r num">${r.total != null ? esc(money(r.total, r.currency)) : MISSING}</td>
          <td><span class="verdict v-${o.cls}">${o.icon}${o.label}</span>${r.flags ? `<div class="sub">${r.flags} ${r.flags === 1 ? "issue" : "issues"} found</div>` : ""}${r.status === "pending" ? `<div class="sub show-sm">Next: ${esc(stageText(r.stage))}</div>` : ""}</td>
          <td class="hide-sm step-cell">${r.status === "pending" ? `<span class="pill ${myTask(r) ? "p-task" : "p-pending"}" ${myTask(r) ? 'title="This is your task"' : ""}>${esc(stageText(r.stage))}</span>` : `<span class="pill p-${r.status}">${STATUS_TXT[r.status]}</span>`}</td></tr>`; }).join("")}
      </tbody></table>`
      : `<div class="empty">${total
          ? `<p>${query ? "No invoice matches that search." : filter === "mine" ? `Nothing is waiting for you right now.</p><p class="sub" style="max-width:52ch;margin:6px auto 0">${esc(WHEN_WORK[ME.user.role] || "")}` : filter === "pending" ? "Nothing is waiting for anyone." : "No invoices here."}</p>`
          : `<p>No invoices yet. ${can("upload") ? "Upload a PDF or photo of an invoice to see it checked." : "Invoices appear here once accounts payable uploads them."}</p>
             ${can("manage") ? `<button class="btn" id="seed" type="button">Load demo data</button>` : ""}`}</div>`}
    </div>
    <div class="note-line">${can("upload") ? (CFG && CFG.public ? "Public demo: everyone sees the same invoices, so don't upload confidential ones. Drop PDF or photo files anywhere on this page to upload. " : "Tip: drop PDF or photo files anywhere on this page to upload them. ") : ""}${can("manage") && total ? `<button class="btn btn-ghost btn-sm btn-danger" id="reset" type="button">Reset demo data</button>` : ""}</div>`;

  $$(".seg button", box).forEach(b => b.onclick = () => { filter = b.dataset.f; refreshQueue(); });
  $$("tr.click", box).forEach(tr => tr.onclick = e => { if (e.target.tagName !== "A") location.hash = "#/invoice/" + tr.dataset.id; });
  const q = $("#q"); let qt; q.oninput = () => { clearTimeout(qt); qt = setTimeout(() => { query = q.value.trim(); refreshQueue().then(() => { const n = $("#q"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }); }, 250); };
  const seed = $("#seed"); if (seed) seed.onclick = async () => { seed.disabled = true; seed.textContent = "Reading the sample invoices…"; try { const r = await api("/api/demo/seed", { method: "POST" }); toast(!r.seeded ? r.message : (r.skipped && r.skipped.length ? `Demo loaded, but ${r.skipped.length} scanned example skipped: ${r.skipped[0].reason}` : `Demo loaded: ${r.invoices.length} invoices read and checked.`), "ok"); filter = "all"; } catch (e) { toast(e.message, "bad"); } refreshQueue(); };
  const reset = $("#reset"); if (reset) reset.onclick = async () => { if (!confirm("Remove every invoice and its history? Users, the AI cache and sign-in history are kept.")) return; try { const r = await api("/api/demo/reset", { method: "POST" }); toast(r.reseeded ? "Back to the starting demo: the sample invoices are loaded again." : "All invoices removed.", "ok"); filter = r.reseeded ? "all" : "pending"; } catch (e) { toast(e.message, "bad"); } refreshQueue(); };
}

async function uploadFiles(files) {
  if (!files.length || !can("upload")) return;
  const btn = $("#uploadBtn"), zone = $("#upzone");
  if (btn) btn.disabled = true;
  if (zone) zone.disabled = true;
  let last = null, done = 0;
  for (const f of files) {
    if (btn) btn.innerHTML = `${I.upload}Reading ${done + 1} of ${files.length}…`;
    if (zone) zone.innerHTML = `${I.upload}<b>Reading ${esc(f.name)}</b><span class="sub">${files.length > 1 ? `${done + 1} of ${files.length}. ` : ""}Reading the document and running the checks…</span>`;
    const fd = new FormData(); fd.append("file", f);
    try { last = await api("/api/invoices", { method: "POST", body: fd }); done++; }
    catch (e) { toast(`${f.name}: ${e.message}`, "bad"); }
  }
  if (btn) { btn.disabled = false; btn.innerHTML = `${I.upload}Upload invoices`; }
  refreshCount();
  if (!done) { if (zone) uploadPage(); return; }
  if (files.length === 1 && last) { location.hash = "#/invoice/" + last.id; toast("Read and checked. Review it: what needs attention, what looks good, then approve or reject.", "ok"); }
  else { filter = "mine"; toast(`${done} invoice${done > 1 ? "s" : ""} read and checked. They are in your tasks.`, "ok"); if (location.hash.startsWith("#/invoices")) route(); else location.hash = "#/invoices"; }
}

/* ============================================================ invoice review */
const FIELD_ROWS = [
  ["vendor", "Vendor", "text"], ["invoice_number", "Invoice number", "text"], ["invoice_date", "Invoice date", "date"],
  ["currency", "Currency", "text"], ["subtotal", "Subtotal", "money"], ["tax_amount", "Tax", "money"], ["total", "Total", "money"],
  ["tax_id", "Seller tax ID", "text"], ["po_number", "Purchase order", "text"], ["bank_account", "Pay to (bank)", "bank"],
];

function handoffStrip(inv) {
  const you = inv.you || {}, st = you.stage || {}, vr = inv.vendor_record || {};
  const closed = inv.status !== "pending" || !!inv.removed_at;
  const label = s => {
    if (s.state === "current") return (st.roles || []).includes(ME.user.role) ? "Your turn" : "Now";
    if (s.state === "todo") return closed ? "Not needed" : "Later";
    if (s.key === "received" || s.key === "checked") return esc(s.by || "");
    const first = n => esc(String(n || "").split(" ")[0]);
    if (s.key === "review") return (s.ok === false ? "Rejected by " : "Approved by ") + first(s.by);
    if (s.key === "vendor") return vr.status === "rejected" ? "Rejected by " + first(vr.approved_by || vr.verified_by)
      : vr.approved_by ? "Approved by " + first(vr.approved_by) : vr.verified_by ? "Verified by " + first(vr.verified_by) : "On file";
    if (s.key === "order") return "Done";
    if (s.key === "decision") return String(s.by || "").startsWith("AI") ? "Automatic" : esc(s.by || "");
    return "";
  };
  return `<ol class="handoff" aria-label="Who has done what">${(you.steps || []).map(s => `<li class="${s.state}">
      <span class="pip" aria-hidden="true">${s.state === "done" ? I.check : ""}</span>
      <b>${esc(s.label)}</b><span>${label(s)}</span><span class="sr">: ${s.state === "done" ? "done" : s.state === "current" ? "in progress" : "later"}</span></li>`).join("")}</ol>`;
}

// the review as pros and cons: what needs attention comes first (that is what a reviewer acts on), then what could not
// be checked, then what the checks confirmed, folded to one line of names because it needs no action
function prosCons(inv) {
  const cs = inv.checks || [];
  const attn = cs.filter(c => c.status === "fail" || c.status === "warn").sort((a, b) => (a.status === "fail" ? 0 : 1) - (b.status === "fail" ? 0 : 1));
  const good = cs.filter(c => c.status === "pass"), un = cs.filter(c => c.status === "skip");
  const li = c => { const m = MARK[c.status]; return `<li><span class="mark ${m[0]}" title="${m[2]}">${m[1]}</span><div><div class="name">${CHECK_NAME[c.name] || esc(c.name)}<span class="sr">: ${m[2]}</span></div><div class="msg">${esc(c.message)}</div></div></li>`; };
  return `<div class="pc">
    <section class="pc-col attn${attn.some(c => c.status === "fail") ? " bad" : ""}" aria-label="Needs attention"><h3>${I.flag}Needs attention<span class="pc-n">${attn.length}</span></h3>
      ${attn.length ? `<ul class="checks">${attn.map(li).join("")}</ul>` : `<p class="pc-none">Nothing failed and nothing looks wrong.</p>`}</section>
    ${un.length ? `<details class="pc-col skip" aria-label="Not checked"><summary><h3>${I.dash}Not checked<span class="pc-n">${un.length}</span></h3>
        <span class="pc-names">${un.map(c => esc(CHECK_NAME[c.name] || c.name)).join(", ")}<span class="pc-more">Why</span></span></summary>
      <ul class="checks">${un.map(li).join("")}</ul></details>` : ""}
    ${good.length ? `<details class="pc-col good" aria-label="Looks good"><summary><h3>${I.check}Looks good<span class="pc-n">${good.length}</span></h3>
        <span class="pc-names">${good.map(c => esc(CHECK_NAME[c.name] || c.name)).join(", ")}<span class="pc-more">Details</span></span></summary>
      <ul class="checks">${good.map(li).join("")}</ul></details>` : ""}
  </div>`;
}

// reasons offered when accounts payable rejects: the problems the checks found first, then the usual ones
const REJECT_WHY = { duplicate: "Duplicate of an invoice already received", math: "The amounts do not add up", bank: "Bank details differ from our records",
  tax_id: "Tax ID does not match the supplier", po_match: "Billed more than was ordered", vendor: "We do not know this supplier", completeness: "Key details are missing" };
function rejectReasons(inv) {
  const found = (inv.checks || []).filter(c => c.status === "fail" || (c.status === "warn" && ["duplicate", "bank", "tax_id", "vendor"].includes(c.name)))
    .map(c => REJECT_WHY[c.name]).filter(Boolean);
  return [...new Set([...found, "Not ordered by us", "Billed to the wrong company"])].slice(0, 5);
}

function taskPanel(inv) {
  const you = inv.you || {}, st = you.stage || {}, f = inv.fields || {}, rev = inv.ap_review || {}, vr = inv.vendor_record || {};
  if (!st.key || st.key === "done") return "";
  const check = n => (inv.checks || []).find(c => c.name === n) || {};
  const waiting = (msg, extra = "") => `<section class="task waiting" aria-label="Next step"><div class="task-head">${I.info}<b>Now with ${esc(st.who.toLowerCase())}: ${esc(st.label.charAt(0).toLowerCase() + st.label.slice(1))}</b></div><p>${msg}</p>${extra}</section>`;
  const reviewed = rev.ok ? `Approved in the accounts payable review by ${esc(rev.by)}${rev.note ? `: “${esc(rev.note)}”` : ""}.` : "";
  const supplier = `<dl class="kvs"><dt>Supplier</dt><dd>${esc(vr.name || f.vendor || "")}</dd>
      <dt>Tax ID</dt><dd class="num">${vr.tax_id ? esc(vr.tax_id) : '<span class="muted">Not on the invoice</span>'}</dd>
      <dt>Bank account</dt><dd class="num">${vr.bank_account ? esc(prettyBank(vr.bank_account)) : '<span class="muted">Not on the invoice</span>'}</dd>
      <dt>Added by</dt><dd>${esc(vr.proposed_by || "accounts payable")}</dd>
      ${vr.verified_by ? `<dt>Verified by</dt><dd>${esc(vr.verified_by)}${vr.note ? `<span class="sub">${esc(vr.note)}</span>` : ""}</dd>` : ""}</dl>`;

  if (st.key === "ap_review") {
    if (!you.can_review) return waiting(`Every invoice is reviewed by accounts payable first, then it comes to the manager.${you.vendor_kind === "new" ? ` ${esc(f.vendor || "The supplier")} is not on the vendor list, so accounts payable adds it with the review.` : ""}`);
    const missing = (you.missing_to_pay || []).map(k => k === "total" ? "amount" : k);
    return `<section class="task" aria-label="Your review" id="reviewTask"><div class="task-head">${I.file}<b>Your review</b></div>
      <p>Compare what was read with the document on the right, then approve the invoice to send it to the manager, or reject it. A rejected invoice is closed and never paid; its record is kept.</p>
      ${missing.length ? `<div class="miss-note">${I.cross}<span>The ${missing.join(" and ")} could not be read. ${missing.length > 1 ? "They are" : "It is"} needed to pay, so fill ${missing.length > 1 ? "them" : "it"} in first.</span></div>
        <div class="row"><button class="btn btn-primary btn-sm" type="button" data-edit>Correct the fields</button></div>`
        : you.can_edit ? `<p class="sub">Something read wrongly? <button class="linkish" style="margin:0" type="button" data-edit>Correct the fields</button> before you approve.</p>` : ""}
      ${you.vendor_kind === "new" ? `<div class="newsup" id="newSup"><b>New supplier: ${esc(f.vendor || "not on the vendor list")}</b>
        <p>This supplier is not on the vendor list. Check the details read from the invoice: they are added with your approval. Procurement then verifies the supplier and a manager approves it; the invoice waits until then.</p>
        <div class="vcard" id="vcard">
          <div class="field"><label for="vcName">Supplier name</label><input class="input" id="vcName" maxlength="200" value="${esc(f.vendor || "")}" autocomplete="off"></div>
          <div class="field"><label for="vcTax">Tax ID (GSTIN / VAT)</label><input class="input num" id="vcTax" maxlength="40" value="${esc(f.tax_id || "")}" autocomplete="off" placeholder="Not on the invoice"><span class="vhint" id="vcTaxHint"></span></div>
          <div class="field"><label for="vcBank">Bank account</label><input class="input num" id="vcBank" maxlength="60" value="${esc(f.bank_account || "")}" autocomplete="off" placeholder="Not on the invoice"><span class="vhint" id="vcBankHint"></span></div>
        </div></div>` : ""}
    </section>`;
  }
  if (st.key === "vendor_verify") {
    const mine = vr.proposed_by && vr.proposed_by === ME.user.name;
    if (!you.can_verify_vendor || mine) return waiting((mine ? `You added ${esc(vr.name || "this supplier")}, so someone else verifies it (segregation of duties). `
      : `${esc(vr.name || "The new supplier")} was added by ${esc(vr.proposed_by || "accounts payable")} with this invoice. `) + "Procurement verifies it, then a manager approves it; the invoice waits until then.", supplier);
    return `<section class="task" aria-label="Your next step"><div class="task-head">${I.vendor}<b>Your next step: verify the new supplier</b></div>
      <p>${esc(vr.proposed_by || "Accounts payable")} added this supplier while reviewing the invoice. Confirm it is real by phoning the supplier on a number you already have, never one printed on this invoice. Once verified, it goes to a manager for approval.</p>
      ${supplier}</section>`;
  }
  if (st.key === "vendor_approve") {
    if (!you.can_approve_vendor) return waiting(`${esc(vr.name || "The new supplier")} was verified by ${esc(vr.verified_by || "procurement")} and waits for a manager's approval. Only an approved supplier is paid.`, supplier);
    return `<section class="task" aria-label="Your next step"><div class="task-head">${I.vendor}<b>Your next step: approve the new supplier</b></div>
      <p>Accounts payable added this supplier and procurement verified it. Approve it to put it on the vendor list, then decide on the invoice. If you reject it, its invoices are not paid.</p>
      ${supplier}${reviewed ? `<p class="sub">${reviewed}</p>` : ""}</section>`;
  }
  if (st.key === "po_missing") {
    const po = check("po_match"), num = (po.details || {}).po || f.po_number || "";
    if (!you.can_record_order) return waiting(`The invoice quotes order <b>${esc(num)}</b>, but no approved order has that number. If it was placed outside the app (by phone or e-mail), procurement records it and a manager approves it before the invoice goes on.`);
    const item = ((f.line_items || [])[0] || {}).description || (f.invoice_number ? `Goods and services on invoice ${f.invoice_number}` : "");
    return `<section class="task" aria-label="Your next step"><div class="task-head">${I.po}<b>Your next step: record order ${esc(num)}</b></div>
      <p>The invoice quotes this order, but no approved order has that number. If it was placed outside the app, record it from your order confirmation. A manager approves it like every other order before the invoice goes on. Enter the amount that was <b>ordered</b>, never the amount on the invoice, or over-billing could not be caught.</p>
      <form class="reqform" id="orderForm" novalidate>
        <div class="field"><label for="ofNum">PO number</label><input class="input num" id="ofNum" value="${esc(num)}" readonly></div>
        <div class="field wide"><label for="ofItem">What was ordered</label><input class="input" id="ofItem" maxlength="300" value="${esc(item)}" required></div>
        <div class="field"><label for="ofVendor">Supplier</label><input class="input" id="ofVendor" maxlength="200" value="${esc(f.vendor || "")}" required></div>
        <div class="field"><label for="ofAmt">Ordered amount</label><input class="input num" id="ofAmt" type="number" min="0.01" step="0.01" required placeholder="From the order"></div>
        <div class="field"><label for="ofCur">Currency</label><input class="input num" id="ofCur" maxlength="3" value="${esc(f.currency || "")}" required></div>
        <div class="field wide"><label for="ofWhy">Why it was ordered outside the app</label><input class="input" id="ofWhy" maxlength="500" required placeholder="e.g. urgent replacement, ordered by phone"></div>
        <div class="actions"><button class="btn btn-primary btn-sm" type="submit">Send to the manager</button></div>
      </form></section>`;
  }
  if (st.key === "po_approval") {
    const o = you.order_request || {};
    const facts = `<dl class="kvs"><dt>Order</dt><dd class="num">${esc(o.po_number || "")}</dd><dt>What</dt><dd>${esc(o.item || "")}</dd>
        <dt>Supplier</dt><dd>${esc(o.vendor || "")}</dd><dt>Ordered</dt><dd class="num">${esc(money(o.amount, o.currency) || "")}</dd>
        <dt>Recorded by</dt><dd>${esc(o.requested_by || "")}</dd><dt>Reason</dt><dd>${esc(o.reason || "")}</dd></dl>`;
    if (!o.can_approve && !o.can_reject) return waiting(`${esc(o.requested_by || "Procurement")} recorded order <b>${esc(o.po_number || "")}</b>, which was placed outside the app. A manager approves it before the invoice goes on.`, facts);
    return `<section class="task" aria-label="Your next step"><div class="task-head">${I.po}<b>Your next step: approve order ${esc(o.po_number || "")}</b></div>
      <p>This invoice quotes an order placed outside the app, and ${esc(o.requested_by || "procurement")} has recorded it. Approve it if the purchase was authorised, then decide on the invoice. Rejecting it rejects the invoice too: an order nobody approved is not paid.</p>
      ${facts}</section>`;
  }
  if (st.key === "receipt") {
    if (!you.can_receipt) return waiting(`The invoice matches purchase order ${esc(f.po_number || "")}. Procurement confirms the goods or services were received before it goes to the manager.`);
    return `<section class="task" aria-label="Your next step"><div class="task-head">${I.po}<b>Your next step: confirm delivery</b></div>
      <p>The invoice matches purchase order <b class="num">${esc(f.po_number || "")}</b>. Were the goods or services received as ordered? That completes the three-way match: order, invoice, delivery.</p></section>`;
  }
  if (st.key === "approval") {
    if (!you.can_decide) return waiting(`${reviewed ? reviewed + " " : ""}The manager gives the final approval, or rejects it.`);
    return `<section class="task" aria-label="Your next step"><div class="task-head">${I.check}<b>Your next step: approve or reject</b></div>
      <p>${reviewed || "Accounts payable has not reviewed this invoice."}${rev.vendor_added && vr.approved_by ? ` The new supplier ${esc(vr.name)} was verified by ${esc(vr.verified_by || "procurement")} and approved by ${esc(vr.approved_by)}.` : ""} The decision is yours: the pros and cons are above and the document is on the right.</p></section>`;
  }
  return "";
}

function fieldsBlock(inv, editing) {
  const f = inv.fields || {}, you = inv.you || {};
  const edits = {}; (inv.edits || []).forEach(e => { edits[e.field] = e; });
  const OPTIONAL = new Set(["subtotal", "tax_amount", "tax_id", "po_number", "bank_account"]);
  const show = (k, kind) => {
    const v = f[k];
    if (v == null || v === "") return MISSING;
    return esc(kind === "money" ? plain(v) + (k === "total" && f.currency ? " " + f.currency : "") : kind === "bank" ? prettyBank(v) : v);
  };
  const tag = k => { const e = edits[k]; if (!e) return "";
    const was = (inv.original_fields || {})[k];
    return ` <span class="chip neutral edited" tabindex="0" data-tip="Read as ${esc(was == null || was === "" ? "nothing" : was)}; corrected by ${esc(e.by)}, ${esc(when(e.at))}${e.note ? ": " + esc(e.note) : ""}">edited</span>`; };
  if (!editing) return `<dl class="fields">${FIELD_ROWS.filter(([k]) => !(OPTIONAL.has(k) && (f[k] == null || f[k] === "") && !edits[k])).map(([k, l, kind]) => `<dt>${l}</dt><dd class="${kind === "text" && k === "vendor" ? "" : "num"}">${show(k, kind)}${tag(k)}</dd>`).join("")}</dl>`;
  const inputVal = (k, kind) => f[k] == null ? "" : esc(kind === "money" ? Number(f[k]).toFixed(2) : f[k]);
  return `<form id="fieldForm" class="fieldform" novalidate>
    ${FIELD_ROWS.map(([k, l, kind]) => `<label for="ff_${k}">${l}</label><input class="input ${kind === "text" && k === "vendor" ? "" : "num"}" id="ff_${k}" name="${k}" value="${inputVal(k, kind)}"
       ${kind === "date" ? 'type="date"' : kind === "money" ? 'inputmode="decimal"' : ""} ${k === "currency" ? 'maxlength="3"' : 'maxlength="200"'} autocomplete="off" spellcheck="false">`).join("")}
    <label for="ff_note">Reason</label><input class="input" id="ff_note" maxlength="500" placeholder="e.g. read wrongly from the scan (optional)">
    <div class="row"><button class="btn btn-primary btn-sm" type="submit">Save and check again</button><button class="btn btn-sm" type="button" id="ffCancel">Cancel</button></div>
  </form>`;
}

function recordCard(inv, flash) {
  // once a decision is made, the reviewer needs the outcome, not the whole review again
  const f = inv.fields || {}, ok = inv.status === "approved", byAI = String(inv.decided_by || "").startsWith("AI");
  const rec = inv.receipt || {}, vr = inv.vendor_record || {}, rev = inv.ap_review || {};
  const byAP = !ok && rev.ok === false && rev.by && rev.by === inv.decided_by;      // closed in the accounts payable review
  if (inv.removed_at) return `<section class="record gone${flash ? " flash" : ""}" role="status" aria-label="Removed">
    <div class="record-head">${I.cross}Removed: not to be paid</div>
    <p>Removed by <b>${esc(inv.removed_by || "a person")}</b>, ${esc(when(inv.removed_at))}.</p>
    <p class="record-note">Reason: ${esc(inv.removed_reason || "")}</p>
    <dl class="kvs"><dt>Supplier</dt><dd>${esc(f.vendor || "")}</dd><dt>Invoice</dt><dd>${esc(f.invoice_number || "")}${f.invoice_date ? ", " + esc(f.invoice_date) : ""}</dd>
      <dt>Amount</dt><dd>${esc(money(f.total, f.currency) || "")}</dd></dl>
  </section>`;
  const problems = (inv.checks || []).filter(c => c.status === "fail" || c.status === "warn");
  const lastOk = (inv.audit || []).filter(a => a.action === "approved").pop();
  const accepted = lastOk && /^Approved with open items: /.test(lastOk.detail || "") ? lastOk.detail.replace(/^Approved with open items: /, "").split(". ")[0] : "";
  const payTo = f.bank_account ? prettyBank(f.bank_account) : vr.bank_account ? prettyBank(vr.bank_account) : "";
  const facts = [
    ["Supplier", `${esc(f.vendor || "")}${vr.name ? `<span class="sub">${vr.status === "rejected" ? "rejected as a supplier" : vr.approved_by ? `new supplier, verified by ${esc(vr.verified_by || "procurement")} and approved by ${esc(vr.approved_by)}` : vr.verified_by ? "verified by " + esc(vr.verified_by) : "on the approved vendor list"}</span>` : ""}`],
    ["Invoice", `${esc(f.invoice_number || "")}${f.invoice_date ? ", " + esc(f.invoice_date) : ""}`],
    ["Amount", esc(money(f.total, f.currency) || "")],
    rev.ok ? ["Reviewed", `${esc(rev.by)}, accounts payable${rev.note ? `<span class="sub">${esc(rev.note)}</span>` : ""}`] : null,
    f.po_number ? ["Order", `${esc(f.po_number)}${rec.ok ? `<span class="sub">delivery confirmed by ${esc(rec.by)}</span>` : ""}`] : null,
    ok && payTo ? ["Pay to", esc(payTo)] : null,
  ].filter(Boolean);
  const who = byAI ? (ok ? "Approved automatically: every check passed and nobody had to step in"
                         : "Stopped automatically by the checks")
                   : byAP ? `Rejected by <b>${esc(inv.decided_by)}</b> in the accounts payable review`
                   : `${ok ? "Approved" : "Rejected"} by <b>${esc(inv.decided_by || "a person")}</b>`;
  return `<section class="record ${ok ? "ok" : "bad"}${flash ? " flash" : ""}" role="status" aria-label="Decision">
    <div class="record-head">${ok ? I.check : I.cross}${ok ? "Approved for payment" : "Rejected: not to be paid"}</div>
    <p>${who}${inv.decided_at ? ", " + esc(when(inv.decided_at)) : ""}.</p>
    ${ok && accepted ? `<p class="record-note">Accepted when approving: ${esc(accepted)}.</p>` : ""}
    ${inv.human_note ? `<p class="record-note">${byAP || !ok ? "Reason" : "Comment"}: ${esc(inv.human_note)}</p>` : ""}
    ${!ok && problems.length ? `<ul class="record-why">${problems.map(c => `<li>${esc(c.message)}</li>`).join("")}</ul>` : ""}
    <dl class="kvs">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
  </section>`;
}

const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);

async function reviewPage(id, opts = {}) {
  setNav("invoices");
  const main = MAIN();
  if (!opts.keep) main.innerHTML = '<div class="page"><p class="muted">Loading…</p></div>';
  let inv;
  try { inv = await api("/api/invoices/" + id); }
  catch (e) { main.innerHTML = `<div class="page"><a class="btn btn-ghost" href="#/invoices">${I.back}Invoices</a><h1 style="margin-top:16px">Invoice not found</h1><p class="muted">${esc(e.message)}</p></div>`; return; }
  const f = inv.fields || {}, d = inv.decision || {}, o = OUTCOME[inv.ai_outcome] || OUTCOME.needs_review, you = inv.you || {};
  const st = you.stage || {}, key = st.key, vr = inv.vendor_record || {}, ord = you.order_request || {};
  document.title = `${f.vendor || inv.filename} · InPro Copilot`;
  const isPdf = /\.pdf$/i.test(inv.filename);
  const removed = !!inv.removed_at;
  const pending = inv.status === "pending" && !removed;
  const src = inv.source || {};
  const canApprove = you.can_approve && inv.status !== "approved";
  const canReject = you.can_reject;
  const isNew = you.vendor_kind === "new";
  const missing = (you.missing_to_pay || []).map(k => k === "total" ? "amount" : k);
  // how the next pages name this invoice: "invoice 123 from Coolblue (EUR 1,250.00)"
  const what = `invoice ${f.invoice_number ? esc(f.invoice_number) + " " : ""}from ${esc(f.vendor || "an unknown supplier")}${f.total != null ? " (" + esc(money(f.total, f.currency)) + ")" : ""}`;

  // the recommendation's sentence, unless the pros and cons below already say exactly that
  const norm = t => String(t || "").toLowerCase().replace(/\s*\(\+\d+ more problems?\)\s*$/, "").replace(/['"‘’“”]/g, "").replace(/[.\s]+$/, "");
  let adviceLine = (d.summary || "").replace(/^(Recommend \w+|Needs HUMAN REVIEW): ?/, "");
  if (/^[a-z]+\b/.test(adviceLine) && !/^[a-z]+[-A-Z]/.test(adviceLine)) adviceLine = cap(adviceLine);
  if ((inv.checks || []).some(c => norm(c.message) === norm(adviceLine))) adviceLine = "";
  const hint = you.can_decide && !canApprove && inv.status !== "approved" && you.approve_blocked ? `${I.info}<span>${esc(you.approve_blocked)}</span>` : "";
  const openItems = pending ? (you.open_items || []) : [];

  const PROOF = `<section class="proof" id="proof" aria-label="Where the problem is" hidden></section>`;
  const CHECKLIST = `
          <h2>What the checks found</h2>
          <ul class="checks">
            ${(inv.checks || []).map(c => { const m = MARK[c.status]; return `<li><span class="mark ${m[0]}" title="${m[2]}">${m[1]}</span><div><div class="name">${CHECK_NAME[c.name] || esc(c.name)}<span class="sr">: ${m[2]}</span></div><div class="msg">${esc(c.message)}</div></div></li>`; }).join("")}
          </ul>`;
  const REST = `
          <div class="h2row"><h2>What was read from the document</h2>${you.can_edit && !opts.editing ? `<button class="btn btn-ghost btn-sm" type="button" data-edit>Correct</button>` : ""}</div>
          <div id="fieldsBox">${fieldsBlock(inv, !!opts.editing)}</div>
          <div class="notes">
            ${(f.notes || []).map(n => `<span>${esc(n)}</span>`).join("")}
            <span>Read by ${f.extractor === "llm" ? "the AI model, with every value verified against the document" : f.extractor === "rules+ai" ? "the layout rules and an AI model together, with every AI value verified against the document" : "the layout rules (no AI request was needed)"}${inv.read_method && inv.read_method.includes("ocr") ? ", using text recognition because the file is a scan or photo" : ""}.</span>
          </div>

          <details class="trace-box"><summary>${I.chev}How the recommendation was reached</summary>
            <ol class="trace">${(inv.trace || []).map(t => `<li><b>${esc(t.step === "check" ? (CHECK_NAME[t.tool] || t.tool) : (STEP_NAME[t.step] || t.step))}</b> <span class="t">${esc(t.step === "check" ? "check" : t.tool)}${t.ms ? `, ${t.ms} ms` : ""}</span><div>${esc(t.summary)}</div></li>`).join("")}</ol>
          </details>

          <h2>History</h2>
          <ul class="hist">${(inv.audit || []).map(a => `<li><span class="actor">${esc(a.actor === "system" ? "System" : a.actor)}</span> ${esc((ACTION_TXT[a.action] || a.action.replace(/_/g, " ")).toLowerCase())}${a.detail ? ": " + esc(a.detail) : ""}<span class="when">${esc(when(a.ts))}</span></li>`).join("")}</ul>
`;
  const OPEN = canApprove && openItems.length ? `<details class="open-items"><summary><b>${openItems.length} still open</b> &nbsp;You can approve anyway: the decision records that you accepted ${openItems.length > 1 ? "them" : "it"}.</summary>
    <ul>${openItems.map(x => `<li>${esc(cap(x))}</li>`).join("")}</ul></details>` : "";
  const CONTROLS = (canApprove || canReject) ? OPEN + `
            <label class="sr" for="note">Comment</label>
            <textarea class="input" id="note" rows="1" placeholder="${pending ? "Comment for the record (optional)" : "Reason for changing the decision (optional)"}"></textarea>
            <div class="row">
              ${canApprove ? `<button class="btn btn-approve" id="approve" type="button">${I.check}${!pending ? "Approve instead" : openItems.length ? "Approve anyway" : "Approve for payment"}</button>`
                : pending && you.can_decide ? `<button class="btn btn-approve" type="button" disabled title="Not yet: see the note above">${I.check}Approve</button>` : ""}
              ${canReject ? `<button class="btn btn-reject" id="reject" type="button">${I.cross}${pending ? "Reject" : "Reject instead"}</button>` : ""}
            </div>` : "";
  const note = (nid, ph) => `<label class="sr" for="${nid}">Note</label><textarea class="input" id="${nid}" rows="1" placeholder="${ph}"></textarea>`;

  // the action bar: whoever's turn it is finds their decision here
  let BAR = "";
  if (pending && key === "ap_review" && you.can_review) {
    BAR = `<div class="decide-main" id="apMain">
        ${missing.length ? `<div class="hint">${I.info}<span>Fill in the ${missing.join(" and ")} first: ${missing.length > 1 ? "they are" : "it is"} needed to pay.</span></div>` : ""}
        ${note("revNote", "Note for the manager (optional)")}
        <div class="row"><button class="btn btn-approve" id="revOk" type="button"${missing.length ? " disabled" : ""}>${I.check}${isNew ? "Add supplier and approve" : "Approve and send to the manager"}</button>
          <button class="btn btn-reject" id="revNo" type="button">${I.cross}Reject</button></div></div>
      <form class="decide-main" id="rejBox" hidden novalidate>
        <div class="rej-q"><b>Reject this invoice?</b> It is closed and never paid. The record stays, with your reason.</div>
        <div class="chips" role="group" aria-label="Common reasons">${rejectReasons(inv).map(r => `<button class="pick" type="button" data-why="${esc(r)}">${esc(r)}</button>`).join("")}</div>
        <label class="sr" for="rejWhy">Reason</label><input class="input" id="rejWhy" maxlength="500" placeholder="Reason (required)">
        <div class="row"><button class="btn btn-reject" type="submit">${I.cross}Reject invoice</button><button class="btn btn-ghost" type="button" id="rejCancel">Cancel</button></div>
      </form>`;
  } else if (pending && key === "vendor_verify" && you.can_verify_vendor && !(vr.proposed_by && vr.proposed_by === ME.user.name)) {
    BAR = `${note("supNote", "Note (required to reject)")}
      <div class="row"><button class="btn btn-approve" type="button" data-sup="verify" data-ok="1">${I.check}Verify the supplier</button>
        <button class="btn btn-reject" type="button" data-sup="verify" data-ok="0">${I.cross}Reject the supplier</button></div>`;
  } else if (pending && key === "vendor_approve" && you.can_approve_vendor) {
    BAR = [vr.proposed_by, vr.verified_by].includes(ME.user.name)
      ? `<div class="hint">${I.info}<span>You added or verified this supplier, so another manager approves it (segregation of duties).</span></div>`
      : `${note("supNote", "Note (required to reject)")}
      <div class="row"><button class="btn btn-approve" type="button" data-sup="approve" data-ok="1">${I.check}Approve the supplier</button>
        <button class="btn btn-reject" type="button" data-sup="approve" data-ok="0">${I.cross}Reject the supplier</button></div>`;
  } else if (pending && key === "po_approval" && (ord.can_approve || ord.can_reject)) {
    BAR = `${ord.approve_blocked ? `<div class="hint">${I.info}<span>${esc(ord.approve_blocked)}</span></div>` : ""}${note("ordNote", "Note (required to reject)")}
      <div class="row">${ord.can_approve ? `<button class="btn btn-approve" type="button" data-order="1">${I.check}Approve the order</button>` : ""}
        ${ord.can_reject ? `<button class="btn btn-reject" type="button" data-order="0">${I.cross}Reject order and invoice</button>` : ""}</div>`;
  } else if (pending && key === "receipt" && you.can_receipt) {
    BAR = `${note("rNote", "Note (required when reporting a problem)")}
      <div class="row"><button class="btn btn-approve" type="button" data-receipt="1">${I.check}Confirm delivery</button>
        <button class="btn btn-reject" type="button" data-receipt="0">${I.cross}Report a problem</button></div>`;
  } else if (pending) {
    BAR = (hint ? `<div class="hint">${hint}</div>` : "") + CONTROLS;
  }
  // a step about a supplier or an order (including adding a new supplier in the review) comes before the pros and cons
  const taskFirst = pending && (["vendor_verify", "vendor_approve", "po_missing", "po_approval", "receipt"].includes(key) || (key === "ap_review" && isNew && you.can_review));
  const banner = opts.banner ? `<div class="banner ${opts.banner.kind || ""}" role="status">${opts.banner.kind === "bad" ? I.cross : I.check}<span>${opts.banner.html}</span></div>` : "";

  main.innerHTML = `
  <div class="review">
    <div class="review-top">
      <a class="btn btn-ghost btn-sm" href="#/invoices">${I.back}Invoices</a>
      <span class="crumb"><b>${esc(f.vendor || "Vendor not found")}</b> &nbsp;${esc(f.invoice_number ? "Invoice " + f.invoice_number : inv.filename)}</span>
      <span class="grow"></span>
      ${removed ? `<span class="pill p-neutral">Removed</span>` : `<span class="pill p-${inv.status}">${pending ? esc(stageText(st)) : STATUS_TXT[inv.status]}</span>`}
      ${you.can_remove ? `<button class="btn btn-ghost btn-sm btn-danger" id="removeBtn" type="button">${I.cross}Remove invoice</button>` : ""}
      <button class="btn btn-sm" id="next" type="button">Next task${I.next}</button>
    </div>
    <div class="review-body">
      <section class="detail" aria-label="Review">
        <div class="detail-body">
          ${banner}
          <h1>${esc(f.vendor || "Vendor not found")}</h1>
          <div class="facts num">Invoice ${esc(f.invoice_number || "number not found")}${f.invoice_date ? ", dated " + esc(f.invoice_date) : ""}</div>
          ${src.by ? `<div class="source-line">${I.upload}<span>Uploaded by ${esc(src.by)}</span></div>` : ""}
          <div class="amount num">${f.total != null ? esc(plain(f.total)) : "Total not found"}<small>${esc(f.currency || "")}</small></div>
          ${handoffStrip(inv)}
          ${you.can_remove ? `<form class="remove-box" id="removeBox" hidden novalidate>
            <div><b>Remove this invoice?</b> It leaves the queue and is never paid. Nothing is deleted: the Activity log keeps who removed it and why.</div>
            <div class="chips" role="group" aria-label="Common reasons">${["Uploaded by mistake", "Wrong file", "Second copy of the same invoice", "Supplier will send a corrected invoice"].map(r => `<button class="pick" type="button" data-reason="${esc(r)}">${esc(r)}</button>`).join("")}</div>
            <label class="sr" for="removeWhy">Reason</label><input class="input" id="removeWhy" maxlength="300" placeholder="Reason (required)">
            <div class="row"><button class="btn btn-reject btn-sm" type="submit">${I.cross}Remove invoice</button><button class="btn btn-ghost btn-sm" type="button" id="removeCancel">Cancel</button></div>
          </form>` : ""}

          ${pending ? `
          <div class="advice ${o.cls}">
            <div class="verdict v-${o.cls}">${o.icon}${o.label}<span class="sub" style="font-weight:400">&nbsp;${esc(d.confidence || "")} confidence</span></div>
            ${adviceLine ? `<p>${esc(adviceLine)}</p>` : ""}
          </div>
          ${taskFirst ? taskPanel(inv) : ""}
          ${prosCons(inv)}` : recordCard(inv, opts.flash)}
          ${taskFirst && pending ? "" : taskPanel(inv)}
          ${inv.status === "approved" || removed ? "" : PROOF}
          ${pending ? REST : `<details class="trace-box full-review"${opts.editing ? " open" : ""}><summary>${I.chev}Full review: checks, fields and history</summary>${inv.status === "approved" || removed ? PROOF : ""}${CHECKLIST}${REST}</details>`}
        </div>

        ${pending ? (BAR ? `<div class="decide">${BAR}</div>` : "")
          : (CONTROLS ? `<div class="decide"><details class="change"><summary>Change the decision</summary>${CONTROLS}</details></div>` : "")}
      </section>

      <section class="docpane" aria-label="Original document">
        <div class="docbar"><b>${esc(inv.filename)}</b><span class="sub">${isPdf ? `${inv.pages || 1} page${(inv.pages || 1) > 1 ? "s" : ""}` : "image"}</span><span class="grow"></span>
          <a class="btn btn-ghost btn-sm" href="/api/invoices/${inv.id}/file" target="_blank" rel="noopener">${I.ext}Open original</a></div>
        <div class="doc">${isPdf ? Array.from({ length: inv.pages || 1 }, (_, i) => `<img src="/api/invoices/${inv.id}/page/${i}.png" alt="Invoice page ${i + 1}" loading="lazy">`).join("") : `<img src="/api/invoices/${inv.id}/file" alt="Scanned invoice ${esc(inv.filename)}">`}</div>
      </section>
    </div>
  </div>`;

  loadProof(inv);
  const busy = (btn, txt) => { $$(".detail button").forEach(b => b.disabled = true); if (btn) btn.textContent = txt; };
  const again = (msg, kind = "ok") => { if (msg) toast(msg, kind); refreshCount(); reviewPage(id, { keep: true, flash: true }); };
  const fail = ex => { toast(ex.message, "bad"); reviewPage(id, { keep: true }); };

  // the manager's decision on the invoice
  const decide = async (approve, btn) => {
    const comment = ($("#note") || {}).value?.trim() || null;
    busy(btn, "Saving…");
    try {
      await api(`/api/invoices/${id}/decision`, { method: "POST", json: { approve, note: comment } });
      if (!pending) return again(approve ? "Decision changed: approved." : "Decision changed: rejected.", approve ? "ok" : "bad");
      donePage({ id: Number(id), kind: approve ? "ok" : "bad", title: approve ? "Approved for payment" : "Invoice rejected",
        text: approve ? `${cap(what)} is approved${openItems.length ? `, with ${openItems.length} open item${openItems.length > 1 ? "s" : ""} recorded as accepted by you` : ""}. Accounts payable can schedule the payment.`
                      : `${cap(what)} is rejected and will not be paid${comment ? `: ${esc(comment)}` : ""}.`,
        who: "Accounts payable has been notified.", nextLabel: "Next invoice to approve" });
    } catch (e) { toast("Not saved: " + e.message, "bad"); reviewPage(id, { keep: true }); }
  };
  if ($("#approve")) $("#approve").onclick = e => decide(true, e.currentTarget);
  if ($("#reject")) $("#reject").onclick = e => decide(false, e.currentTarget);

  // the accounts payable review: approve (with the new supplier, if any) or reject
  if ($("#revOk")) {
    if (isNew) api(`/api/invoices/${id}/vendor-suggestion`).then(sg => {
      const hintOf = (el, c, okTxt) => { if (!el || !c) return; el.className = "vhint " + (c.valid === true ? "ok" : c.valid === false ? "bad" : "warn"); el.textContent = c.valid === true ? okTxt : (c.reason || c.message || ""); };
      hintOf($("#vcTaxHint"), sg.tax_check, sg.tax_check && sg.tax_check.valid ? `${(sg.tax_check.kind || "").replace(/_/g, " ")} is valid` : "");
      hintOf($("#vcBankHint"), sg.bank_check, sg.bank_check ? sg.bank_check.message : "");
    }).catch(() => {});
    $("#revOk").onclick = async e => {
      let vendor = null;
      if (isNew) {
        const name = $("#vcName").value.trim();
        if (!name) { toast("Give the supplier's name.", "bad"); $("#vcName").focus(); return; }
        vendor = { name, tax_id: $("#vcTax").value.trim() || null, bank_account: $("#vcBank").value.trim() || null };
      }
      busy(e.currentTarget, "Saving…");
      try {
        const r = await api(`/api/invoices/${id}/review`, { method: "POST", json: { approve: true, note: $("#revNote").value.trim() || null, vendor } });
        const next = ((r.you || {}).stage || {}).key, sup = esc(vendor ? vendor.name : f.vendor || "");
        const T = {
          vendor_verify: ["Approved. New supplier sent to procurement", `You approved ${what} and added ${sup} as a new supplier. Procurement verifies the supplier, then a manager approves it; after that the invoice goes to the manager.`, "Procurement has been notified."],
          vendor_approve: ["Approved. The supplier needs a manager", `You approved ${what}. Its supplier is verified and waits for a manager's approval; then the manager decides on the invoice.`, "The manager has been notified."],
          po_missing: ["Approved. Procurement records the order", `You approved ${what}. It quotes an order that is not on file, so procurement records it and a manager approves it before the invoice is decided.`, "Procurement has been notified."],
          po_approval: ["Approved. The order needs a manager", `You approved ${what}. Its order waits for a manager's approval; then the manager decides on the invoice.`, "The manager has been notified."],
          receipt: ["Approved. Procurement confirms the delivery", `You approved ${what}. Procurement confirms the delivery, then it goes to the manager.`, "Procurement has been notified."],
          approval: ["Approved and sent to the manager", `${cap(what)} is with the manager for the final approval.`, "The manager has been notified."],
        };
        const [title, text, who] = T[next] || T.approval;
        donePage({ id: Number(id), title, text, who, upload: true, nextLabel: "Review the next invoice" });
      } catch (ex) { fail(ex); }
    };
    const rej = $("#rejBox");
    $("#revNo").onclick = () => { $("#apMain").hidden = true; rej.hidden = false; $("#rejWhy").focus(); };
    $("#rejCancel").onclick = () => { rej.hidden = true; $("#apMain").hidden = false; };
    $$("[data-why]", rej).forEach(c => c.onclick = () => { $("#rejWhy").value = c.dataset.why; $$("[data-why]", rej).forEach(x => x.setAttribute("aria-pressed", x === c)); });
    rej.onsubmit = async e => {
      e.preventDefault();
      const reason = $("#rejWhy").value.trim();
      if (!reason) { toast("Pick or write a reason first.", "bad"); $("#rejWhy").focus(); return; }
      busy(rej.querySelector("[type=submit]"), "Rejecting…");
      try {
        await api(`/api/invoices/${id}/review`, { method: "POST", json: { approve: false, note: reason } });
        refreshCount();
        uploadNote = { kind: "bad", html: `<b>${cap(what)} was rejected and closed:</b> ${esc(reason)}. It will not be paid, and its record is kept under Invoices, Rejected. Upload the corrected invoice when the supplier sends it.` };
        if (can("upload")) location.hash = "#/upload";
        else { toast("Invoice rejected and closed.", "bad"); location.hash = "#/invoices"; }
      } catch (ex) { fail(ex); }
    };
  }

  // a new supplier: procurement verifies it, then a manager approves it
  $$("[data-sup]").forEach(b => b.onclick = async () => {
    const ok = b.dataset.ok === "1", verify = b.dataset.sup === "verify", why = $("#supNote").value.trim();
    if (!ok && !why) { toast("Write why the supplier is rejected.", "bad"); $("#supNote").focus(); return; }
    busy(b, "Saving…");
    try {
      await api(`/api/vendors/${vr.id}/${verify ? "verify" : "approve"}`, { method: "POST", json: { approve: ok, note: why || null } });
      refreshCount();
      if (verify) donePage({ id: Number(id), kind: ok ? "ok" : "bad", title: ok ? "Supplier verified" : "Supplier rejected",
        text: ok ? `${esc(vr.name)} is verified and sent to a manager for approval. ${cap(what)} goes on once the supplier is approved.`
                 : `${esc(vr.name)} was rejected: ${esc(why)}. Its invoices are not paid; ${what} goes to the manager to be rejected.`,
        who: ok ? "The manager has been notified." : "The manager and accounts payable have been notified.", nextLabel: "Next task" });
      else reviewPage(id, { keep: true, flash: true, banner: ok
        ? { html: `<b>Supplier approved.</b> ${esc(vr.name)} is on the vendor list now. Next, approve or reject the invoice below.` }
        : { kind: "bad", html: `<b>Supplier rejected.</b> ${esc(vr.name)} is not paid. Reject the invoice below, with the reason.` } });
    } catch (ex) { fail(ex); }
  });

  // an order placed outside the app: procurement records it, a manager approves it
  const of = $("#orderForm");
  if (of) of.onsubmit = async e => {
    e.preventDefault();
    const amt = Number($("#ofAmt").value), why = $("#ofWhy").value.trim();
    if (!$("#ofItem").value.trim()) { toast("Say what was ordered.", "bad"); $("#ofItem").focus(); return; }
    if (!$("#ofVendor").value.trim()) { toast("Enter the supplier.", "bad"); $("#ofVendor").focus(); return; }
    if (!/^[A-Za-z]{3}$/.test($("#ofCur").value.trim())) { toast("Enter the currency as a 3-letter code, like EUR.", "bad"); $("#ofCur").focus(); return; }
    if (!(amt > 0)) { toast("Enter the amount that was ordered.", "bad"); $("#ofAmt").focus(); return; }
    if (!why) { toast("Say why it was ordered outside the app.", "bad"); $("#ofWhy").focus(); return; }
    busy(of.querySelector("[type=submit]"), "Sending…");
    try {
      const r = await api("/api/purchase-requests/after-the-fact", { method: "POST", json: { invoice_id: Number(id), item: $("#ofItem").value.trim(),
        vendor: $("#ofVendor").value.trim(), amount: amt, currency: $("#ofCur").value.trim().toUpperCase(), reason: why } });
      donePage({ id: Number(id), title: "Order recorded and sent to the manager", text: `Order ${esc(r.po_number || "")} for ${what} waits for a manager's approval. Once it is approved, the manager decides on the invoice.`,
        who: "The manager has been notified.", nextLabel: "Next task" });
    } catch (ex) { fail(ex); }
  };
  $$("[data-order]").forEach(b => b.onclick = async () => {
    const ok = b.dataset.order === "1", why = $("#ordNote").value.trim();
    if (!ok && !why) { toast("Write a reason in the note to reject.", "bad"); $("#ordNote").focus(); return; }
    busy(b, "Saving…");
    try {
      const r = await api(`/api/purchase-requests/${ord.id}/decision`, { method: "POST", json: { approve: ok, note: why || null } });
      refreshCount();
      if (ok) reviewPage(id, { keep: true, flash: true, banner: { html: `<b>Order ${esc(r.po_number || "")} approved.</b> The invoice was checked against it again. Next, approve or reject the invoice below.` } });
      else donePage({ id: Number(id), kind: "bad", title: "Order and invoice rejected", text: `Order ${esc(ord.po_number || "")} was not approved, so ${what} is rejected and will not be paid.`,
        who: "Procurement and accounts payable have been notified.", nextLabel: "Next invoice to approve" });
    } catch (ex) { fail(ex); }
  });
  // procurement's delivery confirmation (only when INPRO_REQUIRE_RECEIPT is on)
  $$("[data-receipt]").forEach(b => b.onclick = async () => {
    const ok = b.dataset.receipt === "1", why = ($("#rNote") || {}).value?.trim() || null;
    if (!ok && !why) { toast("Write what is wrong with the delivery.", "bad"); $("#rNote").focus(); return; }
    busy(b, "Saving…");
    try {
      await api(`/api/invoices/${id}/receipt`, { method: "POST", json: { ok, note: why } });
      donePage({ id: Number(id), kind: ok ? "ok" : "bad", title: ok ? "Delivery confirmed" : "Problem reported",
        text: ok ? `Order, invoice and delivery match for ${what}. It is with the manager for the final approval.` : `The manager sees your note on ${what}, with a recommendation to reject it.`,
        who: "The manager has been notified.", nextLabel: "Next task" });
    } catch (ex) { fail(ex); }
  });

  // remove an invoice uploaded by mistake
  const rb = $("#removeBox");
  if (rb) {
    $("#removeBtn").onclick = () => { rb.hidden = !rb.hidden; if (!rb.hidden) { rb.scrollIntoView({ block: "nearest", behavior: "smooth" }); $("#removeWhy").focus(); } };
    $("#removeCancel").onclick = () => { rb.hidden = true; };
    $$("[data-reason]", rb).forEach(c => c.onclick = () => { $("#removeWhy").value = c.dataset.reason; $$("[data-reason]", rb).forEach(x => x.setAttribute("aria-pressed", x === c)); });
    rb.onsubmit = async e => {
      e.preventDefault();
      const reason = $("#removeWhy").value.trim();
      if (!reason) { toast("Pick or write a reason first.", "bad"); $("#removeWhy").focus(); return; }
      busy(rb.querySelector("[type=submit]"), "Removing…");
      try {
        await api(`/api/invoices/${id}/remove`, { method: "POST", json: { reason } });
        toast("Invoice removed. It will not be paid, and the Activity log keeps the record.", "ok"); refreshCount();
        location.hash = "#/invoices";
      } catch (ex) { fail(ex); }
    };
  }

  // correct the fields (accounts payable, during the review)
  $$("[data-edit]").forEach(b => b.onclick = () => { reviewPage(id, { keep: true, editing: true }).then(() => { const ff = $("#fieldForm"); if (ff) ff.scrollIntoView({ block: "center", behavior: "smooth" }); }); });
  const ff = $("#fieldForm");
  if (ff) {
    $("#ffCancel").onclick = () => reviewPage(id, { keep: true });
    ff.onsubmit = async e => {
      e.preventDefault();
      const changes = {};
      FIELD_ROWS.forEach(([k, , kind]) => {
        const raw = $("#ff_" + k).value.trim();
        const was = f[k] == null ? "" : String(kind === "money" ? Number(f[k]).toFixed(2) : f[k]);
        if (raw !== was) changes[k] = raw === "" ? null : raw;
      });
      if (!Object.keys(changes).length) return reviewPage(id, { keep: true });
      busy(ff.querySelector("[type=submit]"), "Checking…");
      try { await api(`/api/invoices/${id}/fields`, { method: "PATCH", json: { changes, note: $("#ff_note").value.trim() || null } }); again("Saved. The checks ran again with the corrected values."); }
      catch (ex) { toast(ex.message, "bad"); $$(".detail button").forEach(b => b.disabled = false); ff.querySelector("[type=submit]").textContent = "Save and check again"; }
    };
  }

  $("#next").onclick = async () => {
    const rows = await api("/api/invoices?mine=1").catch(() => []);
    const n = rows.find(r => r.id !== Number(id));
    if (n) location.hash = "#/invoice/" + n.id; else toast("No other task is waiting for you.");
  };
}

/* ============================================================ notifications (the bell) */
let bellItems = [], bellTop = null, bellTimer = null, bellWired = false;
async function refreshBell() {
  if (!ME || !$("#bellBtn")) return;
  let r; try { r = await api("/api/notifications"); } catch { return; }
  bellItems = r.items || [];
  const top = bellItems.length ? bellItems[0].id : 0;
  if (bellTop !== null && top > bellTop) {                // something new arrived while the page was open
    const fresh = bellItems.filter(n => n.id > bellTop && n.unread);
    if (fresh.length) toast(fresh.length === 1 ? fresh[0].text : `${fresh.length} new notifications. Open the bell to see them.`);
  }
  bellTop = top;
  const dot = $("#bellDot");
  dot.textContent = r.unread > 9 ? "9+" : r.unread; dot.hidden = !r.unread;
  $("#bellBtn").setAttribute("aria-label", r.unread ? `Notifications, ${r.unread} new` : "Notifications");
  if (!$("#notesPanel").hidden) renderNotes();
}
function renderNotes() {
  const p = $("#notesPanel");
  p.innerHTML = `<header><span>Notifications</span><button class="btn btn-ghost btn-sm" type="button" id="notesClose">Close</button></header>
    ${bellItems.length ? `<ul>${bellItems.map(n => `<li class="${n.unread ? "unread" : ""}"><a href="${esc(n.link || "#/invoices")}"><span>${esc(n.text)}</span><span class="when">${n.actor ? esc(n.actor) + ", " : ""}${esc(when(n.ts))}</span></a></li>`).join("")}</ul>`
      : `<div class="empty"><p>Nothing yet. You hear here when work reaches your step, or when a decision affects your work.</p></div>`}`;
  $("#notesClose").onclick = () => { closeNotes(); $("#bellBtn").focus(); };
  $$("a", p).forEach(a => a.onclick = () => closeNotes());
}
function openNotes() {
  const p = $("#notesPanel"), b = $("#bellBtn"), r = b.getBoundingClientRect();
  renderNotes(); p.hidden = false; b.setAttribute("aria-expanded", "true");
  p.style.left = Math.min(Math.max(12, r.left), innerWidth - p.offsetWidth - 12) + "px";
  p.style.top = Math.min(r.bottom + 8, innerHeight - 120) + "px";
  if (bellItems.some(n => n.unread)) api("/api/notifications/seen", { method: "POST" }).then(() => { $("#bellDot").hidden = true; $("#bellBtn").setAttribute("aria-label", "Notifications"); }).catch(() => {});
  (p.querySelector("li a") || p.querySelector("button")).focus();
}
function closeNotes() {
  const p = $("#notesPanel"); if (!p || p.hidden) return;
  p.hidden = true; $("#bellBtn").setAttribute("aria-expanded", "false");
  bellItems.forEach(n => { n.unread = false; });
}
function wireBell() {
  bellTop = null;
  $("#bellBtn").onclick = e => { e.stopPropagation(); $("#notesPanel").hidden ? openNotes() : closeNotes(); };
  if (!bellWired) {
    bellWired = true;
    document.addEventListener("click", e => { const p = $("#notesPanel"); if (p && !p.hidden && !p.contains(e.target)) closeNotes(); });
    document.addEventListener("keydown", e => { const p = $("#notesPanel"); if (e.key === "Escape" && p && !p.hidden) { closeNotes(); $("#bellBtn").focus(); } });
  }
  clearInterval(bellTimer);
  bellTimer = setInterval(() => { if (document.visibilityState === "visible" && ME) refreshCount(); }, 30000);
}

/* mark what changed. Same length (an IBAN, a tax ID, an invoice number): every character that differs.
   Otherwise the common start and end stay plain and the middle is highlighted. */
function diffMark(from, to) {
  from = String(from || ""); to = String(to || "");
  if (from.length === to.length) {
    let out = "", run = "";
    for (let k = 0; k < to.length; k++) {
      if (from[k] !== to[k]) { run += to[k]; continue; }
      if (run) { out += `<mark>${esc(run)}</mark>`; run = ""; }
      out += esc(to[k]);
    }
    return out + (run ? `<mark>${esc(run)}</mark>` : "");
  }
  let i = 0; while (i < from.length && i < to.length && from[i] === to[i]) i++;
  let j = 0; while (j < from.length - i && j < to.length - i && from[from.length - 1 - j] === to[to.length - 1 - j]) j++;
  const mid = to.slice(i, to.length - j);
  return esc(to.slice(0, i)) + (mid ? `<mark>${esc(mid)}</mark>` : "") + esc(to.slice(to.length - j));
}

function zoom(invId, m, cls = "") {
  return `<div class="zoom ${cls}" data-src="/api/invoices/${invId}/page/${m.page}.png" data-m='${JSON.stringify(m)}' role="img"
    aria-label="Close-up of page ${m.page + 1} where the value is printed"><img alt=""><span class="hit"></span></div>`;
}

function fitZooms(root = document) {
  $$(".zoom[data-src]", root).forEach(el => {
    const img = el.querySelector("img"), box = el.querySelector(".hit"), m = JSON.parse(el.dataset.m);
    const place = () => {
      const cw = el.clientWidth, ch = el.clientHeight, nw = img.naturalWidth, nh = img.naturalHeight;
      if (!cw || !nw) return;
      const mw = Math.max(m.w * nw, 1), mh = Math.max(m.h * nh, 1);
      const s = Math.max(cw / nw, Math.min(0.62 * cw / mw, 0.5 * ch / mh, 3));
      const iw = nw * s, ih = nh * s;
      const left = Math.min(0, Math.max(cw - iw, cw / 2 - (m.x * nw + mw / 2) * s));
      const top = Math.min(0, Math.max(ch - ih, ch / 2 - (m.y * nh + mh / 2) * s));
      Object.assign(img.style, { width: iw + "px", left: left + "px", top: top + "px" });
      Object.assign(box.style, { left: (left + m.x * nw * s - 4) + "px", top: (top + m.y * nh * s - 3) + "px",
                                 width: (mw * s + 8) + "px", height: (mh * s + 6) + "px" });
      el.classList.add("ready");
    };
    el._place = place;
    if (img.complete && img.naturalWidth) place(); else { img.onload = place; img.src = el.dataset.src; }
  });
}
window.addEventListener("resize", () => $$(".zoom.ready").forEach(el => el._place && el._place()));

function proofTable(rows) {
  if (!rows.length) return "";
  const withRef = rows.filter(r => r.ref);
  if (!withRef.length) return `<table class="proof-table"><tbody>${rows.map(r => `<tr><th scope="row">${esc(r.label)}</th><td>${esc(r.value)}</td></tr>`).join("")}</tbody></table>`;
  return `<table class="proof-table"><thead><tr><th></th><th scope="col">${esc(withRef[0].ref_label)}</th><th scope="col">This invoice</th></tr></thead>
    <tbody>${rows.map(r => `<tr><th scope="row">${esc(r.label)}</th><td class="ref">${esc(r.ref || "")}</td><td>${!r.ref ? esc(r.value) : r.kind === "amount" ? (r.ref === r.value ? esc(r.value) : `<mark>${esc(r.value)}</mark>`) : diffMark(r.ref, r.value)}</td></tr>`).join("")}</tbody></table>`;
}

async function loadProof(inv) {
  const box = $("#proof");
  if (!box || !(inv.checks || []).some(c => PROOF_CHECKS.includes(c.name) && (c.status === "fail" || c.status === "warn"))) return;
  let items = [];
  try { items = (await api(`/api/invoices/${inv.id}/evidence`)).items; } catch { return; }
  if (!items.length || !document.body.contains(box)) return;
  box.innerHTML = `<h2>Where the problem is</h2>${items.map(it => {
    const here = it.marks[0], there = it.other && it.other.marks[0];
    const shots = it.other
      ? (here || there ? `<div class="proof-shots">
          ${there ? `<figure class="shot"><figcaption><span>Earlier: invoice #${it.other.id}</span><a href="#/invoice/${it.other.id}">Open</a></figcaption>${zoom(it.other.id, there, "ref")}</figure>` : ""}
          ${here ? `<figure class="shot"><figcaption><span>This invoice</span></figcaption>${zoom(inv.id, here)}</figure>` : ""}</div>` : "")
      : (here ? `<div class="proof-shots"><figure class="shot"><figcaption><span>On the document${here.page ? `, page ${here.page + 1}` : ""}</span></figcaption>${zoom(inv.id, here)}</figure></div>` : "");
    return `<div class="proof-item ${it.status}"><div class="proof-head">${it.status === "fail" ? I.cross : I.flag}${esc(it.title)}</div>${proofTable(it.rows)}${shots}</div>`;
  }).join("")}`;
  box.hidden = false;
  fitZooms(box);
}

async function vendorsPage() {

  const toApprove = v => v.status === "verified" && manager && v.proposed_by !== me && v.verified_by !== me;
  const order = { pending: 1, verified: 1, approved: 2, rejected: 3 };
  rows.sort((a, b) => ((toVerify(a) || toApprove(a)) ? 0 : order[a.status] || 2) - ((toVerify(b) || toApprove(b)) ? 0 : order[b.status] || 2) || a.name.localeCompare(b.name));
  const trail = v => [v.proposed_by ? `Added by ${esc(v.proposed_by)}` : "",
    v.verified_by && v.status !== "pending" && !(v.status === "rejected" && !v.approved_by) ? `verified by ${esc(v.verified_by)}` : "",
    v.status === "approved" && v.approved_by ? `approved by ${esc(v.approved_by)}` : "",
    v.status === "rejected" ? `rejected by ${esc(v.approved_by || v.verified_by || "")}${v.note ? ": " + esc(v.note) : ""}` : ""].filter(Boolean).join(", ");
  MAIN().innerHTML = `<div class="page">
    <div class="page-head"><div><h1>Vendors</h1><p>The suppliers on file and how each is paid. An invoice that changes the tax ID or the bank account is stopped. A new supplier is added by accounts payable, usually while reviewing its first invoice; procurement verifies it and a manager approves it. Only then is it paid.</p></div></div>
    ${canAdd ? `<div class="panel"><div class="panel-head"><h2>${verifier ? "Add a supplier" : "Propose a supplier"}</h2><span class="sub">${local ? "Added straight to the list" : verifier ? "A manager approves it" : "Procurement verifies it, then a manager approves it"}</span></div><div class="panel-body">
      <form id="vForm" class="form-row">
        <div class="field"><label for="vName">Supplier name</label><input class="input" id="vName" required maxlength="200" placeholder="e.g. Coastal Supplies Pvt Ltd"></div>
        <div class="field"><label for="vTax">Tax ID (GSTIN / VAT)</label><input class="input" id="vTax" maxlength="40" placeholder="Optional"></div>
        <div class="field"><label for="vBank">Bank account (IBAN, or account / IFSC)</label><input class="input" id="vBank" maxlength="60" placeholder="Optional"></div>
        <div><button class="btn btn-primary" type="submit">${verifier ? "Add supplier" : "Propose supplier"}</button></div>
      </form></div></div>` : ""}
    <div class="panel">
      ${rows.length ? `<table><thead><tr><th>Supplier</th><th>Tax ID</th><th>Paid to</th><th>Status</th></tr></thead><tbody>
        ${rows.map(v => { const [cls, txt] = STATUS[v.status] || STATUS.approved; const t = trail(v);
          const act = toVerify(v) ? ["verify", "Verify"] : toApprove(v) ? ["approve", "Approve"] : null;
          const self = (v.status === "pending" && verifier && v.proposed_by === me) || (v.status === "verified" && manager && (v.proposed_by === me || v.verified_by === me));
          return `<tr><td class="cell-title">${esc(v.name)}${t ? `<div class="sub" style="font-weight:400">${t}</div>` : ""}</td>
          <td class="num">${v.tax_id ? esc(v.tax_id) : v.status === "pending" || v.status === "verified" ? '<span class="muted">To be confirmed</span>' : '<span class="muted">Not on file</span>'}</td>
          <td class="num">${v.bank_account ? esc(prettyBank(v.bank_account)) : v.status === "pending" || v.status === "verified" ? '<span class="muted">To be confirmed</span>' : '<span class="muted" title="Saved from the first approved invoice that shows one, and checked from then on">Not on file</span>'}</td>
          <td><span class="pill ${cls}">${act ? "Your turn: " + act[1].toLowerCase() : txt}</span>
            ${act ? `<div class="vrow" data-vid="${v.id}" data-act="${act[0]}">
              <button class="btn btn-sm" type="button" data-v="1">${I.check}${act[1]}</button><button class="btn btn-sm btn-reject" type="button" data-v="0">Reject</button></div>`
              : self ? '<div class="sub">You added or verified it; someone else decides</div>' : ""}</td></tr>`; }).join("")}
      </tbody></table>` : `<div class="empty"><p>No suppliers yet.</p></div>`}
    </div>
    ${rows.some(toVerify) ? `<p class="note-line">Before verifying, confirm the details with the supplier on a phone number you already have, never one printed on the invoice.</p>` : ""}
  </div>`;
  const form = $("#vForm");
  if (form) form.onsubmit = async e => {
    e.preventDefault();
    try {
      const r = await api("/api/vendors", { method: "POST", json: { name: $("#vName").value.trim(), tax_id: $("#vTax").value.trim() || null, bank_account: $("#vBank").value.trim() || null } });

    };
  });
}

/* ============================================================ activity */
let actFilter = "all";
function about(a) {      // what an activity entry concerns: an invoice, an order, a vendor, a user or a sign-in
  const link = (href, text) => `<a class="cell-title" href="${href}">${esc(text)}</a>`;
  if (a.invoice_id) return link(`#/invoice/${a.invoice_id}`, a.vendor || a.filename || "Invoice #" + a.invoice_id);
  if (/^po_/.test(a.action)) { const m = /request #(\d+)/.exec(a.detail || ""); return link("#/pos", m ? "Purchase request #" + m[1] : "Purchase orders"); }
  if (/^vendor_/.test(a.action)) return link("#/vendors", "Vendors");
  if (/^user_/.test(a.action)) return can("manage") ? link("#/users", "Users") : "Users";
  if (a.action === "demo_reset") return "Demo data";
  if (["password_changed", "switched_role"].includes(a.action)) return "Account";
  return "Sign-in";
}
async function activityPage() {
  setNav("activity"); document.title = "Activity · InPro Copilot";
  let rows = [];

  };
  const shown = rows.filter(groups[actFilter]);
  MAIN().innerHTML = `<div class="page">

      <div class="toolbar"><div class="seg" role="group" aria-label="Show">
        ${[["all", "Everything"], ["decisions", "Decisions"], ["ai", "AI steps"], ["changes", "Orders, vendors and corrections"], ["security", "Sign-ins and users"]].map(([k, l]) => `<button type="button" data-a="${k}" aria-pressed="${actFilter === k}">${l}</button>`).join("")}
      </div></div>
      ${shown.length ? `<table><thead><tr><th>When</th><th>Who</th><th>What</th><th class="hide-sm">About</th></tr></thead><tbody>
        ${shown.map(a => `<tr><td class="num sub" style="white-space:nowrap">${esc(when(a.ts))}</td><td><b style="font-weight:600">${esc(a.actor === "system" ? "System" : a.actor)}</b></td>
          <td>${esc(ACTION_TXT[a.action] || a.action.replace(/_/g, " "))}${a.detail ? `<div class="sub">${esc(a.detail)}</div>` : ""}</td>
          <td class="hide-sm">${about(a)}</td></tr>`).join("")}

    <div class="grid-2">
      <div class="panel metric"><div class="label">Requests today</div><div class="value num">${u.today.calls} <span class="sub">of ${u.limits.daily_requests} allowed</span></div><div class="meter"><i style="width:${pct(u.today.calls, u.limits.daily_requests)}%"></i></div></div>
      <div class="panel metric"><div class="label">Estimated cost this month</div><div class="value num">$${u.month.cost_usd.toFixed(4)} <span class="sub">of $${u.limits.monthly_budget_usd.toFixed(2)} budget</span></div><div class="meter"><i style="width:${pct(u.month.cost_usd, u.limits.monthly_budget_usd)}%"></i></div></div>
    </div>
    <div class="panel" style="margin-top:16px"><div class="panel-head"><h2>Setup</h2></div><div class="panel-body">
      <dl class="kv">
        <dt>Reading mode</dt><dd>${esc(modeTxt)}</dd>
        <dt>Models, in order</dt><dd>${u.models.length ? u.models.map((m, i) => `${i + 1}. ${esc(m.provider)} ${esc(m.model)} <span class="pill p-neutral">${m.free ? "free tier" : "paid"}</span>`).join("<br>") : '<span class="muted">None. Add GEMINI_API_KEY or GROQ_API_KEY to .env.</span>'}</dd>
        <dt>This month</dt><dd class="num">${u.month.calls} requests, ${(u.month.input_tokens + u.month.output_tokens).toLocaleString()} tokens</dd>
        <dt>Cached documents</dt><dd class="num">${u.cached_documents} (re-reading them costs nothing)</dd>
      </dl>
      <div id="testOut"></div>
    </div></div>
    <div class="panel" style="margin-top:16px"><div class="panel-head"><h2>By model, this month</h2></div>
      ${u.by_model.length ? `<table><thead><tr><th>Provider</th><th>Model</th><th class="r">Requests</th><th class="r">Tokens</th><th class="r">Estimated cost</th></tr></thead><tbody>
        ${u.by_model.map(m => `<tr><td>${esc(m.provider)}</td><td class="num">${esc(m.model)}</td><td class="r num">${m.calls}</td><td class="r num">${(m.tokens || 0).toLocaleString()}</td><td class="r num">$${(m.cost_usd || 0).toFixed(4)}</td></tr>`).join("")}
      </tbody></table>` : `<div class="empty"><p>No AI requests yet this month.</p></div>`}
    </div></div>`;
  const t = $("#testAi");
  if (t) t.onclick = async () => {
    t.disabled = true; t.textContent = "Testing…";
    try { const r = await api("/api/ai/test", { method: "POST" }); $("#testOut").innerHTML = `<ul class="checks" style="margin-top:16px">${r.map(x => `<li><span class="mark ${x.ok ? "m-pass" : "m-fail"}">${x.ok ? I.check : I.cross}</span><div><div class="name">${esc(x.provider)} ${esc(x.model)}</div><div class="msg">${esc(x.detail)}</div></div></li>`).join("")}</ul>`; }
    catch (e) { toast(e.message, "bad"); }
    t.disabled = false; t.textContent = "Test AI connection";
  };
}

/* ============================================================ users (admin) */
async function usersPage() {
  setNav("users"); document.title = "Users · InPro Copilot";
  if (!can("manage")) { MAIN().innerHTML = `<div class="page"><h1>Users</h1><p class="muted">Only managers can manage users.</p></div>`; return; }
  let rows = [];
  try { rows = await api("/api/users"); } catch (e) { toast(e.message, "bad"); }
  MAIN().innerHTML = `<div class="page">
    <div class="page-head"><div><h1>Users</h1><p>Who can sign in and what they may do. Accounts payable uploads every invoice, reviews it first and adds new suppliers; procurement verifies new suppliers and prepares purchase orders; managers approve suppliers, orders and every invoice (up to their limit, if one is set) and manage users. No role can both record and approve an invoice. There is no public sign-up: accounts are created here.</p></div></div>
    <div class="panel"><div class="panel-head"><h2>Add a user</h2></div><div class="panel-body">
      <form id="uForm" class="form-row">
        <div class="field"><label for="uName">Full name</label><input class="input" id="uName" required maxlength="80"></div>
        <div class="field"><label for="uEmail">Work email</label><input class="input" id="uEmail" type="email" required maxlength="200"></div>
        <div class="field"><label for="uRole">Role</label><select class="input" id="uRole"><option value="ap">Accounts payable</option><option value="procurement">Procurement</option><option value="approver">Manager</option></select></div>
        <div class="field"><label for="uLimit">Approval limit (optional)</label><input class="input num" id="uLimit" type="number" min="0" step="1" placeholder="No limit"></div>
        <div class="field"><label for="uPw">Temporary password</label><input class="input" id="uPw" type="password" autocomplete="new-password" required></div>
        <div><button class="btn btn-primary" type="submit">Add user</button></div>
      </form>
      <p class="sub" style="margin-top:10px">Passwords need at least 10 characters with upper- and lower-case letters and a number. Ask the person to change it after their first sign-in.</p>
    </div></div>
    <div class="panel">
      <table><thead><tr><th>Name</th><th>Role</th><th class="r">Approval limit</th><th class="hide-sm">Last sign-in</th><th>Status</th><th></th></tr></thead><tbody>
      ${rows.map(u => `<tr><td><span class="cell-title">${esc(u.name)}</span><div class="sub">${esc(u.email)}</div></td>
        <td>${esc(ROLE_TXT[u.role] || u.role)}</td>
        <td class="r num">${u.role === "approver" ? (u.approval_limit != null ? esc(plain(u.approval_limit)) : "No limit") : '<span class="muted">Does not approve</span>'}</td>
        <td class="hide-sm sub">${u.last_login ? esc(when(u.last_login)) : "Never"}</td>
        <td>${!u.active ? '<span class="pill p-neutral">Disabled</span>' : u.locked ? '<span class="pill p-rejected">Locked</span>' : '<span class="pill p-approved">Active</span>'}</td>
        <td><div class="inline-actions">${u.id === ME.user.id ? '<span class="sub">You</span>' : `
          <button class="btn btn-ghost btn-sm" data-act="pw" data-id="${u.id}" type="button">Reset password</button>
          <button class="btn btn-ghost btn-sm${u.active ? " btn-danger" : ""}" data-act="toggle" data-id="${u.id}" data-active="${u.active ? 1 : 0}" type="button">${u.active ? "Disable" : "Enable"}</button>`}</div></td></tr>`).join("")}
      </tbody></table>
    </div></div>`;
  $("#uForm").onsubmit = async e => {
    e.preventDefault();
    const lim = $("#uLimit").value;
    try { await api("/api/users", { method: "POST", json: { name: $("#uName").value.trim(), email: $("#uEmail").value.trim(), role: $("#uRole").value, approval_limit: lim === "" ? null : Number(lim), password: $("#uPw").value } }); toast("User added. They can sign in now.", "ok"); usersPage(); }
    catch (ex) { toast(ex.message, "bad"); }
  };
  $$("[data-act]").forEach(b => b.onclick = async () => {
    const id = b.dataset.id;
    try {
      if (b.dataset.act === "toggle") { await api(`/api/users/${id}`, { method: "PATCH", json: { active: b.dataset.active !== "1" } }); toast(b.dataset.active === "1" ? "User disabled and signed out." : "User enabled.", "ok"); }
      else { const pw = prompt("New temporary password (at least 10 characters, upper- and lower-case letters and a number):"); if (!pw) return; await api(`/api/users/${id}`, { method: "PATCH", json: { password: pw } }); toast("Password reset. The user was signed out everywhere.", "ok"); }
      usersPage();
    } catch (ex) { toast(ex.message, "bad"); }
  });
}

/* ============================================================ change password */
function openPassword() {
  const d = $("#pwDialog"); $("#pwForm").reset(); $("#pwErr").hidden = true; d.showModal(); $("#pwCur").focus();
}
$("#pwCancel").onclick = () => $("#pwDialog").close();
$("#pwForm").onsubmit = async e => {
  e.preventDefault();
  const err = $("#pwErr");
  if ($("#pwNew").value !== $("#pwNew2").value) { err.textContent = "The two new passwords are different."; err.hidden = false; return; }
  try { await api("/api/auth/password", { method: "POST", json: { current: $("#pwCur").value, new: $("#pwNew").value } }); $("#pwDialog").close(); toast("Password changed. Other devices were signed out.", "ok"); }
  catch (ex) { err.textContent = ex.message; err.hidden = false; }
};

/* ============================================================ routing and start-up */
function route() {
  if (!ME) return;
  const h = location.hash;
  const m = h.match(/^#\/invoice\/(\d+)/);
  if (m) return reviewPage(m[1]);
  if (h.startsWith("#/invoices") || h.startsWith("#/done")) return invoicesPage();
  if (h.startsWith("#/upload")) return uploadPage();
  if (h.startsWith("#/vendors")) return vendorsPage();
  if (h.startsWith("#/pos")) return posPage();
  if (h.startsWith("#/activity")) return activityPage();
  if (h.startsWith("#/ai")) return aiPage();
  if (h.startsWith("#/users")) return usersPage();
  return overviewPage();
}
window.addEventListener("hashchange", route);
$("#file").onchange = e => { uploadFiles([...e.target.files]); e.target.value = ""; };

// drag and drop anywhere on the Invoices or Upload page
let dragDepth = 0;
const onInvoices = () => ME && can("upload") && /^#\/(invoices|upload)/.test(location.hash);
window.addEventListener("dragenter", e => { if (!onInvoices() || ![...(e.dataTransfer?.types || [])].includes("Files")) return; dragDepth++; $("#dropzone").classList.add("on"); });
window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("#dropzone").classList.remove("on"); });
window.addEventListener("dragover", e => { if (onInvoices()) e.preventDefault(); });
window.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("#dropzone").classList.remove("on"); if (onInvoices()) uploadFiles([...e.dataTransfer.files]); });

async function boot() {
  try { CFG = await api("/api/auth/config"); } catch (e) { $("#root").innerHTML = `<div class="login"><div class="login-box"><div class="login-card"><h1>Server not reachable</h1><p class="muted" style="margin-top:8px">${esc(e.message)}</p></div></div></div>`; return; }
  try { ME = await api("/api/auth/me"); } catch { ME = null; }
  if (!ME || !ME.user) { ME = null; return showLogin(); }
  try { HEALTH = await api("/api/health"); } catch { HEALTH = null; }
  shell();
  refreshCount();
  route();
}
boot();
</script>
